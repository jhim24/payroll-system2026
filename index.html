<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

  <style>
    body {
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
    }

    h2 {
      border-bottom:3px solid blue;
    }

    button {
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .nav {background:green;}
    .add {background:green;}
    .update {background:orange;}
    .delete {background:red;}
    .edit {background:gray;}

    .box {
      border:2px solid blue;
      padding:15px;
      border-radius:10px;
      background:white;
    }

    input, select {
      padding:8px;
      margin:5px;
      width:180px;
    }

    /* 🔥 SCROLL TABLE */
    .table-container {
      width:100%;
      overflow-x:auto;
    }

    table {
      min-width:1400px;
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background:white;
      border:2px solid blue;
      font-size:12px;
    }

    th, td {
      border:1px solid #ccc;
      padding:8px;
      text-align:center;
      white-space:nowrap;
    }

    th {
      background:blue;
      color:white;
      position:sticky;
      top:0;
    }
    th:first-child, td:first-child {
  position: sticky;
  left: 0;
  background: #fff;
  z-index: 1;
}

th:first-child {
  background: blue;
  color: white;
  z-index: 2;
}
  </style>
</head>
<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name"><br>

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly><br>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact Number"><br>

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID"><br>

<input id="passport" placeholder="Passport">

<select id="bank">
<option value="">Select Bank</option>
<option>BDO</option>
<option>BPI</option>
<option>Metrobank</option>
<option>Landbank</option>
<option>UnionBank</option>
</select>

<input id="bankAccount" placeholder="Bank Account"><br>

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG"><br>

<button class="add" onclick="add()">Add</button>
<button class="update" onclick="update()">Update</button>
<button onclick="location.reload()">Refresh</button>

</div>

<!-- ✅ FIXED TABLE -->
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>First</th>
        <th>Middle</th>
        <th>Last</th>
        <th>Age</th>
        <th>Address</th>
        <th>Contact</th>
        <th>Email</th>
        <th>ID</th>
        <th>Passport</th>
        <th>Bank</th>
        <th>Account</th>
        <th>SSS</th>
        <th>PhilHealth</th>
        <th>Pag-IBIG</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="table"></tbody>
  </table>
</div>
<input onkeyup="search(0,this.value)" placeholder="Search First">
<input onkeyup="search(1,this.value)" placeholder="Search Middle">
<input onkeyup="search(2,this.value)" placeholder="Search Last">
<input onkeyup="search(6,this.value)" placeholder="Search Email">
<script>
let data = JSON.parse(localStorage.getItem("employees")) || [];
let editIndex = -1;

// AGE AUTO
birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

function save(){
  localStorage.setItem("employees", JSON.stringify(data));
}

function render(){
  table.innerHTML="";
  data.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td>${e.fname}</td>
      <td>${e.mname}</td>
      <td>${e.lname}</td>
      <td>${e.age}</td>
      <td>${e.address}</td>
      <td>${e.contact}</td>
      <td>${e.email}</td>
      <td>${e.empid}</td>
      <td>${e.passport}</td>
      <td>${e.bank}</td>
      <td>${e.bankAccount}</td>
      <td>${e.sss}</td>
      <td>${e.philhealth}</td>
      <td>${e.pagibig}</td>
      <td>
        <button class="edit" onclick="edit(${i})">Edit</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    birthday: birthday.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    bank: bank.value,
    bankAccount: bankAccount.value,
    sss: sss.value,
    philhealth: philhealth.value,
    pagibig: pagibig.value
  };
}

function add(){
  data.push(getForm());
  save(); render(); clear();
}

function edit(i){
  let e=data[i]; editIndex=i;
  fname.value=e.fname;
  mname.value=e.mname;
  lname.value=e.lname;
  birthday.value=e.birthday;
  age.value=e.age;
  address.value=e.address;
  contact.value=e.contact;
  email.value=e.email;
  empid.value=e.empid;
  passport.value=e.passport;
  bank.value=e.bank;
  bankAccount.value=e.bankAccount;
  sss.value=e.sss;
  philhealth.value=e.philhealth;
  pagibig.value=e.pagibig;
}

function update(){
  if(editIndex==-1) return;
  data[editIndex]=getForm();
  save(); render(); clear();
  editIndex=-1;
}

function del(i){
  data.splice(i,1);
  save(); render();
}

function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  bank.value="";
}

function goPayroll(){
  window.location.href="payroll.html";
}

render();
</script>

</body>
</html>
