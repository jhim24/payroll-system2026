<!DOCTYPE html>
<html>
<head>
  <title>HR Dashboard</title>

  <style>
    body {
      font-family: Arial;
      margin:0;
      text-align:center;

      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color:white;
    }

    header {
      background:linear-gradient(to right, blue, purple);
      color:white;
      padding:20px;
      font-size:22px;
      font-weight:bold;
      position:relative;
    }

    .logout {
      position:absolute;
      right:20px;
      top:20px;
      padding:8px 15px;
      border:none;
      background:red;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .container {
      padding:30px;
      text-align:center;
    }

    /* 🔥 STATS BOX */
    .stats {
      background:rgba(0,0,0,0.4);
      border:2px solid white;
      padding:15px;
      border-radius:10px;
      display:inline-block;
    }

    /* 🔥 BUTTON AREA */
    .buttons {
      margin-top:30px;
    }

    /* 🔥 CARD STYLE (BUTTON STYLE) */
    .card {
      display:inline-block;
      min-width:140px;
      padding:10px 20px;
      margin:10px;
      border-radius:6px;
      font-size:14px;
      cursor:pointer;
      transition:0.2s;
      text-align:center;
      box-shadow:0 2px 5px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform:scale(1.05);
      opacity:0.9;
    }

    .emp {background:green;}
    .pay {background:orange;}
    .his {background:blue;}

    h3 {
      margin:5px 0 0;
      font-size:14px;
    }
  </style>
</head>

<body>

<header>
  💼 HR DASHBOARD
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- 🔥 STATS -->
  <div class="stats">
    Total Employees: <b id="empCount">0</b> |
    Total Payroll: ₱ <b id="totalPay">0</b> |
    Total Records: <b id="recCount">0</b>
  </div>

  <!-- 🔥 BUTTONS (NASA BABA NA) -->
  <div class="buttons">

    <div class="card emp" onclick="goEmployee()">
      👥
      <h3>Employee List</h3>
    </div>

    <div class="card pay" onclick="goPayroll()">
      💰
      <h3>Payroll</h3>
    </div>

    <div class="card his" onclick="goHistory()">
      📊
      <h3>History</h3>
    </div>

  </div>

</div>

<script>

// 🔐 LOGIN CHECK
if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}

// LOAD DATA
let emp = JSON.parse(localStorage.getItem("employees")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

// TOTAL EMPLOYEES
document.getElementById("empCount").innerText = emp.length;

// TOTAL PAYROLL
let total = 0;
history.forEach(e=>{
  total += Number(e.net || 0);
});
document.getElementById("totalPay").innerText = total.toFixed(2);

// TOTAL RECORDS
document.getElementById("recCount").innerText = history.length;

// NAVIGATION
function goEmployee(){
  window.location.href = "employee.html";
}

function goPayroll(){
  window.location.href = "payroll.html";
}

function goHistory(){
  window.location.href = "history.html";
}

// LOGOUT
function logout(){
  localStorage.removeItem("login");
  window.location.href = "login.html";
}

</script>

</body>
</html>
