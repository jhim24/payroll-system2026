<!DOCTYPE html>
<html>
<head>
  <title>HR Dashboard</title>

  <style>
    body {
      font-family: Arial;
      margin:0;
      text-align:center;

      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color:white;
    }

    header {
      background:linear-gradient(to right, blue, purple);
      color:white;
      padding:20px;
      font-size:22px;
      font-weight:bold;
      position:relative;
    }

    .logout {
      position:absolute;
      right:20px;
      top:20px;
      padding:8px 15px;
      border:none;
      background:red;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .container {
      padding:30px;
      text-align:center;
    }

    .stats {
      background:rgba(0,0,0,0.4);
      border:2px solid white;
      padding:15px;
      border-radius:10px;
      display:inline-block;
    }

    .buttons {
      margin-top:30px;
    }

    .card {
      display:inline-block;
      min-width:140px;
      padding:10px 20px;
      margin:10px;
      border-radius:6px;
      font-size:14px;
      cursor:pointer;
      transition:0.2s;
      text-align:center;
      box-shadow:0 2px 5px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform:scale(1.05);
      opacity:0.9;
    }

    .emp {background:green;}
    .pay {background:orange;}
    .his {background:blue;}

    h3 {
      margin:5px 0 0;
      font-size:14px;
    }

    /* 🔥 EXISTING ADD */
    .stats {
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.3);
      box-shadow:0 0 15px rgba(0,255,255,0.3);
    }

    .card {
      backdrop-filter: blur(8px);
      border:1px solid rgba(255,255,255,0.2);
    }

    .card:hover {
      box-shadow:0 0 20px rgba(0,255,255,0.7);
    }

    .emp:hover {box-shadow:0 0 15px lime;}
    .pay:hover {box-shadow:0 0 15px orange;}
    .his:hover {box-shadow:0 0 15px cyan;}

    .container {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }

    /* 🔥 SIDEBAR */
    .sidebar {
      position:fixed;
      left:0;
      top:0;
      width:200px;
      height:100%;
      background:rgba(0,0,0,0.8);
      padding:20px;
      text-align:left;
      z-index:999;
    }

    .sidebar h2 { color:white; }

    .sidebar button {
      width:100%;
      margin:10px 0;
      padding:10px;
      border:none;
      background:#333;
      color:white;
      cursor:pointer;
      border-radius:5px;
    }

    .sidebar button:hover {
      background:cyan;
      color:black;
    }

    .container { margin-left:220px; }

    .dark {
      background:black !important;
      color:white !important;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>HR</h2>
  <button onclick="goEmployee()">👥 Employees</button>
  <button onclick="goPayroll()">💰 Payroll</button>
  <button onclick="goHistory()">📊 History</button>
  <hr>
  <button onclick="toggleMode()">🌙 Dark Mode</button>
</div>

<header>
  💼 HR DASHBOARD

  <!-- 🔥 ADD ONLY ROLE DISPLAY -->
  <span id="roleText" style="position:absolute; left:20px;"></span>

  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="stats">
    Total Employees: <b id="empCount">0</b> |
    Total Payroll: ₱ <b id="totalPay">0</b> |
    Total Records: <b id="recCount">0</b>
  </div>

  <br><br>
  <canvas id="myChart" width="300" height="150"></canvas>

  <div class="buttons">

    <div class="card emp" onclick="goEmployee()">
      👥
      <h3>Employee List</h3>
    </div>

    <div class="card pay" onclick="goPayroll()">
      💰
      <h3>Payroll</h3>
    </div>

    <div class="card his" onclick="goHistory()">
      📊
      <h3>History</h3>
    </div>

  </div>

  <!-- 🔥 ADD ONLY DOWNLOAD -->
  <br>
  <button onclick="downloadPDF()" style="padding:8px 15px; border:none; background:#444; color:white; border-radius:5px;">
    Download Report 📄
  </button>

</div>

<script>

// 🔐 LOGIN CHECK
if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}

// LOAD DATA
let emp = JSON.parse(localStorage.getItem("employees")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

// TOTAL
document.getElementById("empCount").innerText = emp.length;

let total = 0;
history.forEach(e=>{
  total += Number(e.net || 0);
});
document.getElementById("totalPay").innerText = total.toFixed(2);

document.getElementById("recCount").innerText = history.length;

// NAV
function goEmployee(){ window.location.href="employee.html"; }
function goPayroll(){ window.location.href="payroll.html"; }
function goHistory(){ window.location.href="history.html"; }

// LOGOUT
function logout(){
  localStorage.removeItem("login");
  window.location.href = "login.html";
}

// DARK MODE
function toggleMode(){
  document.body.classList.toggle("dark");
}

// =======================
// 🔥 ADD ONLY FEATURES
// =======================

// ROLE DISPLAY
let role = localStorage.getItem("role") || "admin";
document.getElementById("roleText").innerText = "👤 " + role.toUpperCase();

// ACCESS CONTROL
if(role === "staff"){
  let empBtn = document.querySelector(".emp");
  if(empBtn) empBtn.style.display = "none";
}

// DOWNLOAD REPORT
function downloadPDF(){
  window.print();
}

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
setTimeout(()=>{
  try{
    let history = JSON.parse(localStorage.getItem("history")) || [];

    let names = history.map(e=>e.name || "EMP");
    let nets = history.map(e=>Number(e.net || 0));

    let ctx = document.getElementById("myChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: names,
        datasets: [{
          label: "Net Salary",
          data: nets
        }]
      }
    });
  }catch(e){}
},500);
</script>

</body>
</html>
