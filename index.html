<body>

<div class="sidebar">
  <h2>HR</h2>
  <button onclick="goEmployee()">👥 Employees</button>
  <button onclick="goPayroll()">💰 Payroll</button>
  <button onclick="goHistory()">📊 History</button>

  <!-- ✅ ADD ONLY -->
  <button onclick="goAttendance()">🕒 Attendance</button>

  <hr>
  <button onclick="toggleMode()">🌙 Dark Mode</button>
</div>

<header>
  💼 HR DASHBOARD
  <span id="roleText" style="position:absolute; left:20px;"></span>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="stats">
    Total Employees: <b id="empCount">0</b> |
    Total Payroll: ₱ <b id="totalPay">0</b> |
    Total Records: <b id="recCount">0</b>
  </div>

  <br><br>
  <canvas id="myChart"></canvas>

  <div class="buttons">
    <div class="card emp" onclick="goEmployee()">👥<h3>Employee List</h3></div>
    <div class="card pay" onclick="goPayroll()">💰<h3>Payroll</h3></div>
    <div class="card his" onclick="goHistory()">📊<h3>History</h3></div>
  </div>

  <br>
  <button onclick="downloadPDF()" style="padding:8px 15px; border:none; background:#444; color:white; border-radius:5px;">
    Download Report 📄
  </button>

  <!-- 🔥 ADD ONLY DASHBOARD -->
  <div class="extra-box">
    <h3>📊 Attendance Summary</h3>
    <canvas id="attChart"></canvas>
  </div>

  <div class="extra-box">
    <h3>💰 Auto Payroll Preview</h3>
    <div id="autoPay"></div>
  </div>

</div>

<script>
if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}

let emp = JSON.parse(localStorage.getItem("employees")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

document.getElementById("empCount").innerText = emp.length;

let total = 0;
history.forEach(e=> total += Number(e.net || 0));
document.getElementById("totalPay").innerText = total.toFixed(2);

document.getElementById("recCount").innerText = history.length;

function goEmployee(){ window.location.href="employee.html"; }
function goPayroll(){ window.location.href="payroll.html"; }
function goHistory(){ window.location.href="history.html"; }

function goAttendance(){
  window.location.href = "attendance.html";
}

function logout(){
  localStorage.removeItem("login");
  window.location.href = "login.html";
}

function toggleMode(){
  document.body.classList.toggle("dark");
}

let role = localStorage.getItem("role") || "admin";
document.getElementById("roleText").innerText = "👤 " + role.toUpperCase();

if(role === "staff"){
  let empBtn = document.querySelector(".emp");
  if(empBtn) empBtn.style.display="none";
}

function downloadPDF(){
  window.print();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
setTimeout(()=>{
  let history = JSON.parse(localStorage.getItem("history")) || [];
  let ctx = document.getElementById("myChart");

  new Chart(ctx, {
    type:"bar",
    data:{
      labels: history.map(e=>e.name || "EMP"),
      datasets:[{
        label:"Net Salary",
        data: history.map(e=>Number(e.net || 0))
      }]
    }
  });
},500);

// 🔥 ADD ONLY
setTimeout(()=>{
  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

  let present=0, late=0, absent=0;

  attendance.forEach(a=>{
    if(a.status==="Present") present++;
    if(a.status==="Late") late++;
    if(a.status==="Absent") absent++;
  });

  let ctx2 = document.getElementById("attChart");

  if(ctx2){
    new Chart(ctx2, {
      type:"pie",
      data:{
        labels:["Present","Late","Absent"],
        datasets:[{
          data:[present,late,absent]
        }]
      }
    });
  }

  let summary={};
  attendance.forEach(a=>{
    if(!summary[a.name]) summary[a.name]={p:0,l:0};
    if(a.status==="Present") summary[a.name].p++;
    if(a.status==="Late") summary[a.name].l++;
  });

  let output="";
  for(let n in summary){
    let days = summary[n].p + (summary[n].l*0.5);
    output += `<div>${n} → ${days} days</div>`;
  }

  document.getElementById("autoPay").innerHTML = output;

},1000);
  // ===============================
// 🔥 AUTO TIME-IN SYSTEM (SMART)
// ===============================
function autoTimeInSystem(){
  let employees = JSON.parse(localStorage.getItem("employees")) || [];
  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

  let today = new Date().toLocaleDateString();
  let now = new Date();

  employees.forEach(e=>{
    let name = (e.fname || "") + " " + (e.lname || "");

    let exist = attendance.find(a=>a.name===name && a.date===today);

    if(!exist){
      let hour = now.getHours();

      let status = "Present";
      if(hour >= 9) status = "Late";

      attendance.push({
        name: name,
        date: today,
        timeIn: now.toLocaleTimeString(),
        status: status
      });
    }
  });

  localStorage.setItem("attendance", JSON.stringify(attendance));
}

// AUTO RUN
setTimeout(()=>{
  autoTimeInSystem();
},1200);


// ===============================
// 🔥 AUTO PAYROLL (REAL COMPUTE)
// ===============================
function autoPayrollFromAttendance(){

  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];
  let employees = JSON.parse(localStorage.getItem("employees")) || [];

  let summary = {};

  attendance.forEach(a=>{
    if(!summary[a.name]) summary[a.name] = 0;

    if(a.status==="Present") summary[a.name]+=1;
    if(a.status==="Late") summary[a.name]+=0.5;
  });

  let output = "";

  employees.forEach(e=>{
    let name = (e.fname || "") + " " + (e.lname || "");
    let rate = Number(e.rate || 0);

    let days = summary[name] || 0;
    let salary = days * rate;

    output += `
      <div style="padding:5px;">
        💼 ${name}<br>
        Days: ${days} | Salary: ₱ ${salary.toFixed(2)}
      </div>
    `;
  });

  let box = document.getElementById("autoPay");
  if(box) box.innerHTML = output;
}

// AUTO RUN
setTimeout(()=>{
  autoPayrollFromAttendance();
},1800);


// ===============================
// 🔥 AUTO ABSENT DETECTION
// ===============================
setTimeout(()=>{
  let employees = JSON.parse(localStorage.getItem("employees")) || [];
  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

  let today = new Date().toLocaleDateString();

  employees.forEach(e=>{
    let name = (e.fname || "") + " " + (e.lname || "");

    let exist = attendance.find(a=>a.name===name && a.date===today);

    if(!exist){
      attendance.push({
        name:name,
        date:today,
        status:"Absent"
      });
    }
  });

  localStorage.setItem("attendance", JSON.stringify(attendance));
},3000);


// ===============================
// 🔥 LIVE DASHBOARD REFRESH
// ===============================
setInterval(()=>{
  let history = JSON.parse(localStorage.getItem("history")) || [];

  let total = 0;
  history.forEach(e=> total += Number(e.net || 0));

  let el = document.getElementById("totalPay");
  if(el) el.innerText = total.toFixed(2);

},4000);


// ===============================
// 🔥 REAL-TIME CLOCK (HEADER)
// ===============================
let clock = document.createElement("div");
clock.style.position="absolute";
clock.style.right="120px";
clock.style.top="20px";
clock.style.fontSize="13px";

document.querySelector("header").appendChild(clock);

setInterval(()=>{
  clock.innerText = new Date().toLocaleTimeString();
},1000);
</script>
