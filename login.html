<!DOCTYPE html>
<html>
<body>

<h2>Login</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<script>
function login(){
  let u = user.value;
  let p = pass.value;

  if(u === "admin" && p === "1234"){
    window.location.href = "index.html";
  } else {
    alert("Wrong login");
  }
}
</script>

</body>
</html>
