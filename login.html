<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
  font-family: Arial;
  background:#eef3ff;
  text-align:center;
  padding-top:100px;
}

.box {
  display:inline-block;
  padding:30px;
  background:white;
  border-radius:10px;
  border:2px solid blue;
}

input {
  padding:10px;
  margin:10px;
  width:200px;
}

button {
  padding:10px;
  background:blue;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 HR Login</h2>

<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

</div>

<script>

function login(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  // 👉 DEFAULT ACCOUNT
  if(u === "admin" && p === "1234"){
    localStorage.setItem("login","true");
    window.location.href = "index.html";
  }else{
    alert("Wrong username or password");
  }
}

</script>

</body>
</html>
