<!DOCTYPE html>
<html>
<head>
<title>Payroll History</title>

<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid green;}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.back {background:#444;}

table {
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #999;
  padding:6px;
  text-align:center;
  font-size:12px;
}

th {
  background:linear-gradient(to right, #2e7d32, #1b5e20);
  color:white;
}

tbody tr:nth-child(even){background:#f4f9f4;}
tbody tr:hover{background:#c8e6c9;}

.table-container{
  max-height:500px;
  overflow:auto;
  border:2px solid green;
}
</style>
</head>

<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="window.location.href='index.html'">⬅ Back</button>

<div class="table-container">
<table>
<tr>
<th>Name</th>
<th>Gross</th>
<th>OT</th>
<th>Holiday</th>
<th>Vacation</th>
<th>Sick</th>
<th>Birthday</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Other</th>
<th>Reason</th>
<th>Health</th>
<th>Card #</th>
<th>Net</th>
<th>Date</th>
</tr>
<tbody id="historyTable"></tbody>
</table>
</div>

<script>

// LOAD HISTORY
function loadHistory(){

  let history = JSON.parse(localStorage.getItem("history")) || [];
  let table = document.getElementById("historyTable");

  table.innerHTML = "";

  if(history.length === 0){
    table.innerHTML = "<tr><td colspan='16'>No records found</td></tr>";
    return;
  }

  history.forEach(h=>{
    table.innerHTML += `
    <tr>
      <td>${h.name}</td>
      <td>${Number(h.gross).toFixed(2)}</td>
      <td>${Number(h.ot).toFixed(2)}</td>
      <td>${Number(h.holiday).toFixed(2)}</td>
      <td>${Number(h.vac).toFixed(2)}</td>
      <td>${Number(h.sick).toFixed(2)}</td>
      <td>${Number(h.bday).toFixed(2)}</td>
      <td>${Number(h.sss).toFixed(2)}</td>
      <td>${Number(h.phil).toFixed(2)}</td>
      <td>${Number(h.pag).toFixed(2)}</td>
      <td>${Number(h.other).toFixed(2)}</td>
      <td>${h.reason}</td>
      <td>${Number(h.health).toFixed(2)}</td>
      <td>${h.card}</td>
      <td><b>${Number(h.net).toFixed(2)}</b></td>
      <td>${h.date}</td>
    </tr>
    `;
  });

}

// AUTO LOAD
loadHistory();

</script>

</body>
</html>
