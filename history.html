<!DOCTYPE html>
<html>
<head>
<title>Payroll History</title>

<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid blue;}

button {
  padding:8px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.back {background:#444;}
.delete {background:red;}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:white;
  border:2px solid blue;
}

th, td {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

th {background:blue; color:white;}

.details {
  margin-top:20px;
  padding:20px;
  border:2px solid green;
  border-radius:10px;
  background:white;
}
</style>
</head>

<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="window.location.href='payroll.html'">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>

<tbody id="table"></tbody>
</table>

<div id="details" class="details"></div>

<script>

let history = JSON.parse(localStorage.getItem("history")) || [];

function load(){
  table.innerHTML = "";

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td onclick="view(${i})">${e.name}</td>
      <td>${e.net}</td>
      <td>${e.date}</td>
      <td><button class="delete" onclick="del(${i})">Delete</button></td>
    </tr>
    `;
  });
}

function view(i){
  let e = history[i];

  details.innerHTML = `
  <h3>${e.name}</h3>
  <p>Gross: ${e.gross}</p>
  <p>OT: ${e.ot}</p>
  <p>Holiday: ${e.holiday}</p>
  <p>Vacation: ${e.vac}</p>
  <p>Sick: ${e.sick}</p>
  <p>Birthday: ${e.bday}</p>
  <p>SSS: ${e.sss}</p>
  <p>PhilHealth: ${e.philhealth}</p>
  <p>Pag-IBIG: ${e.pagibig}</p>
  <h3>Net: ${e.net}</h3>
  `;
}

function del(i){
  if(confirm("Delete?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    details.innerHTML="";
  }
}

load();

</script>

</body>
</html>
