<!DOCTYPE html>
<html>
<head>
<title>PAYROLL HISTORY</title>
<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid blue;}

button {
  padding:6px;
  border:none;
  color:Prussian Blue;
  border-radius:5px;
  cursor:pointer;
  margin:5px;
}

.back {background:#00b4d8;}
.delete {background:red;}

table {
  width:50%;
  border-collapse:collapse;
  margin-top:20px;
  background:silver;
  border:2px solid blue;
}

th, td {
  border:1px solid #ccc;
  padding:5px;
  text-align:center;
}

th {background:blue; color:white;}

tr:hover {background:#f1f1f1;}

.details {
  margin-top:20px;
  padding:5px;
  border:2px solid green;
  border-radius:10px;
  background:Yale Blue;
  overflow-x:auto;
}

/* 🔥 EXISTING SIZE */
th, td {
  padding:5px !important;
  height:auto !important;
  line-height:1.3 !important;
  font-size:11px;
}

tr { height:auto !important; }

/* 🔥 SCROLL */
table { overflow-x:auto; }

.table-container {
  width:100%;
  overflow-x:auto;
}

table {
  width:100% !important;
  min-width:100% !important;
  border-collapse:collapse;
}

td, th { width:auto; }

/* ================================= */
/* 🔥🔥 ADD ONLY PREMIUM DESIGN */
/* ================================= */

/* 🌟 GLASS EFFECT */
body {
  background: linear-gradient(to right, #dfe9f3, #ffffff);
}

.table-container table {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border-radius:10px;
  overflow:hidden;
}

/* 🌟 HEADER GRADIENT */
th {
  background: linear-gradient(to right, #0077b6, #03045e);
  color:white;
}

/* 🌟 HOVER EFFECT */
tr:hover {
  background: rgba(0,183,255,0.2);
  transform: scale(1.01);
  transition:0.2s;
}

/* 🌟 DASHBOARD STYLE */
#dashboard {
  backdrop-filter: blur(10px);
  box-shadow:0 0 15px rgba(0,255,255,0.3);
}

/* 🌟 SEARCH INPUT */
input {
  border-radius:5px;
  border:1px solid #ccc;
}

/* 🌟 BUTTON HOVER */
button:hover {
  transform:scale(1.05);
  opacity:0.9;
}

/* 🌟 DETAILS BOX UPGRADE */
.details {
  backdrop-filter: blur(10px);
  box-shadow:0 0 20px rgba(0,255,0,0.3);
}

/* ================================= */
/* 🔥🔥 NEW ADD: PREMIUM BORDER */
/* ================================= */

#dashboard {
  border:2px solid rgba(0, 200, 255, 0.6) !important;
  border-radius:15px !important;
  box-shadow:
    0 0 10px rgba(0,200,255,0.5),
    0 0 25px rgba(0,200,255,0.3);
  padding:10px !important;
}

/* individual cards */
#dashboard div {
  background: rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.5);
  border-radius:10px;
  padding:8px 12px;
  box-shadow:0 0 10px rgba(0,255,255,0.3);
  transition:0.2s;
}

/* hover effect */
#dashboard div:hover {
  transform:scale(1.05);
  background:rgba(0,255,255,0.2);
}

/* optional glow animation */
#dashboard {
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow:0 0 10px cyan; }
  to { box-shadow:0 0 25px blue; }
}
/* 🔥 ALL BORDERS (FULL GRID STYLE) */

/* outer border */
table {
  border:2px solid #444 !important;
}

/* all cells */
th, td {
  border:1px solid #666 !important;
}

/* ensure collapse (no double lines) */
table {
  border-collapse:collapse !important;
}

/* header stronger */
th {
  border:1px solid #333 !important;
}

/* row + column lines */
tr {
  border:1px solid #666 !important;
}

/* cleaner look */
tbody tr:nth-child(even) {
  background:rgba(0,0,0,0.04);
}
</style>
</head>

<body>

<h2 style="color:#03045e;">📊 Payroll History</h2>

<!-- 🔥 DASHBOARD -->
<div id="dashboard" style="
background:Yale Blue;
border:2px solid blue;
padding:5px;
border-radius:10px;
margin-top:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
">
<div><b>Total Records:</b> <span id="totalRec">0</span></div>
<div><b>Total Net:</b> ₱ <span id="totalNet">0</span></div>
<div><b>Employees:</b> <span id="totalEmp">0</span></div>
</div>

<!-- 🔍 SEARCH -->
<input onkeyup="searchHistory(this.value)" placeholder="Search name..." style="padding:8px; margin-top:10px; width:200px;">

<!-- 📅 FILTER -->
<br><br>
<input type="date" onchange="filterDate(this.value)">
<button onclick="resetFilter()">Reset</button>

<br>

<button class="back" onclick="window.location.href='payroll.html'">⬅ Back</button>

<!-- 🔥 WRAPPED TABLE -->
<div class="table-container">
<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>

<tbody id="table"></tbody>
</table>
</div>

<div id="details" class="details"></div>

<script>

let history = JSON.parse(localStorage.getItem("history")) || [];

function load(){
  table.innerHTML = "";

  if(history.length === 0){
    table.innerHTML = "<tr><td colspan='4'>No records found</td></tr>";
    updateDashboard([]);
    return;
  }

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr id="row${i}">
      <td onclick="view(${i})" style="cursor:pointer; color:blue;">${e.name}</td>
      <td onclick="view(${i})">${e.net}</td>
      <td onclick="view(${i})">${e.date}</td>
      <td><button class="delete" onclick="del(${i})">Delete</button></td>
    </tr>
    `;
  });

  updateDashboard(history);
}

function view(i){

  document.querySelectorAll("#table tr").forEach(r=> r.style.background="");

  let row = document.getElementById("row"+i);
  if(row) row.style.background="#d1ffd1";

  let e = history[i];

  document.getElementById("details").innerHTML = `
  <table style="min-width:900px; border-collapse:collapse; border:2px solid green;">
    <tr style="background:green; color:white;">
      <th>Name</th><th>Gross</th><th>OT</th><th>Holiday</th>
      <th>Vacation</th><th>Sick</th><th>Birthday</th>
      <th>SSS</th><th>PhilHealth</th><th>Pag-IBIG</th><th>Net</th>
    </tr>
    <tr>
      <td>${e.name}</td>
      <td>${e.gross}</td>
      <td>${e.ot}</td>
      <td>${e.holiday}</td>
      <td>${e.vac}</td>
      <td>${e.sick}</td>
      <td>${e.bday}</td>
      <td>${e.sss}</td>
      <td>${e.philhealth}</td>
      <td>${e.pagibig}</td>
      <td><b style="color:green;">${e.net}</b></td>
    </tr>
  </table>
  <br>
  <button onclick="printRecord()">🖨️ Print</button>
  <button onclick="exportRecord()">📊 Export</button>
  `;
}

function del(i){
  if(confirm("Delete this record?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    details.innerHTML = "";
  }
}

function printRecord(){
  let content = document.getElementById("details").innerHTML;
  let w = window.open("");
  w.document.write(content);
  w.print();
}

function exportRecord(){
  let content = document.getElementById("details").innerHTML;

  let blob = new Blob([content], {type:"application/vnd.ms-excel"});
  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "payroll_record.xls";
  a.click();
}

function searchHistory(value){
  let rows = document.querySelectorAll("#table tr");

  rows.forEach(r=>{
    let cell = r.children[0];
    if(!cell) return;

    let text = cell.innerText.toLowerCase();
    r.style.display = text.includes(value.toLowerCase()) ? "" : "none";
  });
}

function updateDashboard(data){
  document.getElementById("totalRec").innerText = data.length;

  let total = 0;
  let empSet = new Set();

  data.forEach(e=>{
    total += Number(e.net);
    empSet.add(e.name);
  });

  document.getElementById("totalNet").innerText = total.toFixed(2);
  document.getElementById("totalEmp").innerText = empSet.size;
}

function filterDate(date){
  let rows = document.querySelectorAll("#table tr");

  rows.forEach((r,i)=>{
    let e = history[i];
    if(!e) return;

    r.style.display = e.date.includes(date) ? "" : "none";
  });

  let filtered = history.filter(e=>e.date.includes(date));
  updateDashboard(filtered);
}

function resetFilter(){
  load();
}

load();

if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}
</script>

</body>
</html>
