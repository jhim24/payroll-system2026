<!DOCTYPE html>
<html>
<head>
<title>Payroll History</title>

<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid blue;}

button {
  padding:8px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
  margin:5px;
}

.back {background:#444;}
.delete {background:red;}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:white;
  border:2px solid blue;
}

th, td {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

th {background:blue; color:white;}

tr:hover {
  background:#f1f1f1;
}

.details {
  margin-top:20px;
  padding:10px;
  border:2px solid green;
  border-radius:10px;
  background:white;
  overflow-x:auto;
}
</style>
</head>

<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="window.location.href='payroll.html'">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>

<tbody id="table"></tbody>
</table>

<!-- 🔥 DETAILS TABLE OUTPUT -->
<div id="details" class="details"></div>

<script>

let history = JSON.parse(localStorage.getItem("history")) || [];

// LOAD TABLE
function load(){
  table.innerHTML = "";

  if(history.length === 0){
    table.innerHTML = "<tr><td colspan='4'>No records found</td></tr>";
    return;
  }

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td onclick="view(${i})" style="cursor:pointer; color:blue;">
        ${e.name}
      </td>
      <td onclick="view(${i})">${e.net}</td>
      <td onclick="view(${i})">${e.date}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });
}

// 🔥 TABLE STYLE BREAKDOWN VIEW
function view(i){
  let e = history[i];

  document.getElementById("details").innerHTML = `
  <table style="min-width:900px; border-collapse:collapse; border:2px solid green;">

    <tr style="background:green; color:white;">
      <th>Name</th>
      <th>Gross</th>
      <th>OT</th>
      <th>Holiday</th>
      <th>Vacation</th>
      <th>Sick</th>
      <th>Birthday</th>
      <th>SSS</th>
      <th>PhilHealth</th>
      <th>Pag-IBIG</th>
      <th>Net</th>
    </tr>

    <tr>
      <td>${e.name}</td>
      <td>${e.gross}</td>
      <td>${e.ot}</td>
      <td>${e.holiday}</td>
      <td>${e.vac}</td>
      <td>${e.sick}</td>
      <td>${e.bday}</td>
      <td>${e.sss}</td>
      <td>${e.philhealth}</td>
      <td>${e.pagibig}</td>
      <td><b style="color:green;">${e.net}</b></td>
    </tr>

  </table>
  `;
}

// DELETE
function del(i){
  if(confirm("Delete this record?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    details.innerHTML = "";
  }
}

// INIT
load();

</script>

</body>
</html>
