<!DOCTYPE html>
<html>
<head>
  <title>Payroll History</title>
  <style>
    body {
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
    }

    h2 {
      border-bottom:3px solid blue;
    }

    button {
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .back {background:#444;}

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      background:white;
      border:2px solid blue;
    }

    th, td {
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    th {
      background:blue;
      color:white;
    }

    tr:hover {
      background:#f1f1f1;
    }

    /* 🔥 DETAILS BOX */
    .details {
      margin-top:20px;
      padding:20px;
      border:2px solid blue;
      border-radius:10px;
      background:white;
      width:100%;
      max-width:500px;
    }

    .details h3 {
      margin-bottom:10px;
      border-bottom:2px solid #ccc;
      padding-bottom:5px;
    }

    .line {
      display:flex;
      justify-content:space-between;
      padding:5px 0;
      border-bottom:1px dashed #ccc;
    }

    .net {
      font-weight:bold;
      color:green;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>
<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="back()">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
</tr>
<tbody id="table"></tbody>
</table>

<!-- 🔥 DETAILS -->
<div id="details"></div>

<script>
let history = JSON.parse(localStorage.getItem("history")) || [];

// LOAD TABLE
history.forEach((e,i)=>{
  table.innerHTML += `
  <tr onclick="view(${i})">
    <td>${e.name}</td>
    <td>${e.net}</td>
    <td>${e.date}</td>
  </tr>`;
});

// VIEW DETAILS (FIXED UI)
function view(i){
  let e = history[i];

  details.innerHTML = `
  <div class="details">
    <h3>${e.name}</h3>

    <div class="line"><span>Gross</span><span>${e.gross}</span></div>
    <div class="line"><span>OT</span><span>${e.ot}</span></div>
    <div class="line"><span>Holiday</span><span>${e.holiday}</span></div>
    <div class="line"><span>Leave</span><span>${e.leave}</span></div>

    <br>

    <div class="line"><span>SSS</span><span>${e.sss}</span></div>
    <div class="line"><span>PhilHealth</span><span>${e.philhealth}</span></div>
    <div class="line"><span>Pag-IBIG</span><span>${e.pagibig}</span></div>

    <div class="net">Net: ${e.net}</div>
  </div>
  `;
}

// BACK BUTTON
function back(){
  window.location.href = "payroll.html";
}
</script>

</body>
</html>
