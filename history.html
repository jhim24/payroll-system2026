<!DOCTYPE html>
<html>
<head>
  <title>Payroll History</title>
  <style>
    body {font-family:Arial; padding:20px;}
    table {width:100%; border-collapse:collapse;}
    th, td {border:1px solid #ccc; padding:10px; text-align:center;}
    th {background:blue; color:white;}
    tr {cursor:pointer;}
  </style>
</head>
<body>

<h2>📊 Payroll History</h2>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
</tr>
<tbody id="table"></tbody>
</table>

<div id="details"></div>

<script>
let history = JSON.parse(localStorage.getItem("history")) || [];

history.forEach((e,i)=>{
  table.innerHTML += `
  <tr onclick="view(${i})">
    <td>${e.name}</td>
    <td>${e.net}</td>
    <td>${e.date}</td>
  </tr>`;
});

function view(i){
  let e = history[i];

  details.innerHTML = `
  <h3>${e.name}</h3>
  Gross: ${e.gross}<br>
  OT: ${e.ot}<br>
  Holiday: ${e.holiday}<br>
  Leave: ${e.leave}<br><br>
  SSS: ${e.sss}<br>
  PhilHealth: ${e.philhealth}<br>
  Pag-IBIG: ${e.pagibig}<br><br>
  <b>Net: ${e.net}</b>
  `;
}
</script>

</body>
</html>
