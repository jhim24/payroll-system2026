<!DOCTYPE html>
<html>
<head>
  <title>Payroll History</title>

  <style>
    body {
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
    }

    h2 {
      border-bottom:3px solid blue;
    }

    button {
      padding:8px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
      margin:5px;
    }

    .back {background:#444;}
    .delete {background:red;}

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      background:white;
      border:2px solid blue;
    }

    th, td {
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    th {
      background:blue;
      color:white;
    }

    tr:hover {
      background:#f1f1f1;
    }

    .details {
      margin-top:20px;
      padding:20px;
      border:2px solid green;
      border-radius:10px;
      background:white;
    }

    .line {
      display:flex;
      justify-content:space-between;
      border-bottom:1px dashed #ccc;
      padding:5px 0;
    }

    .net {
      font-weight:bold;
      color:green;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="back()">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>

<tbody id="table"></tbody>
</table>

<div id="details" class="details"></div>

<script>

// LOAD HISTORY
let history = JSON.parse(localStorage.getItem("history")) || [];

// LOAD TABLE
function load(){
  let table = document.getElementById("table");
  table.innerHTML = "";

  if(history.length === 0){
    table.innerHTML = "<tr><td colspan='4'>No records found</td></tr>";
    return;
  }

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td onclick="view(${i})" style="cursor:pointer;">${e.name}</td>
      <td onclick="view(${i})">${e.net}</td>
      <td onclick="view(${i})">${e.date}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });
}

// VIEW DETAILS
function view(i){
  let e = history[i];

  document.getElementById("details").innerHTML = `
    <h3>${e.name}</h3>

    <div class="line"><span>Gross</span><span>${e.gross}</span></div>
    <div class="line"><span>OT</span><span>${e.ot}</span></div>
    <div class="line"><span>Holiday</span><span>${e.holiday}</span></div>

    <div class="line"><span>Vacation</span><span>${e.vac}</span></div>
    <div class="line"><span>Sick</span><span>${e.sick}</span></div>
    <div class="line"><span>Birthday</span><span>${e.bday}</span></div>

    <div class="line"><span>SSS</span><span>${e.sss}</span></div>
    <div class="line"><span>PhilHealth</span><span>${e.philhealth}</span></div>
    <div class="line"><span>Pag-IBIG</span><span>${e.pagibig}</span></div>

    <div class="net">Net: ${e.net}</div>
  `;
}

// DELETE
function del(i){
  if(confirm("Delete this record?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    document.getElementById("details").innerHTML = "";
  }
}

// BACK
function back(){
  window.location.href = "payroll.html";
}

// INIT
load();

</script>

</body>
</html>
