<!DOCTYPE html>
<html>
<head>
<title>Payroll History</title>

}
<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid blue;}

button {
  padding:8px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
  margin:5px;
}

.back {background:#444;}
.delete {background:red;}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:white;
  border:2px solid blue;
}

th, td {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

th {background:blue; color:white;}

tr:hover {background:#f1f1f1;}

.details {
  margin-top:20px;
  padding:10px;
  border:2px solid green;
  border-radius:10px;
  background:white;
  overflow-x:auto;
}
  /* 🔥 COMPACT HISTORY TABLE */
th, td {
  padding:8px !important;
  height:auto !important;
  line-height:1 !important;
  font-size:11px;
}

tr {
  height:auto !important;
}

/* 🔥 SCROLL IF MAHABA */
table {
  display:block;
  overflow-x:auto;
}
</style>
</head>

<body>

<h2>📊 Payroll History</h2>

<!-- 🔥 DASHBOARD (ADD ONLY) -->
<div id="dashboard" style="
background:white;
border:2px solid blue;
padding:15px;
border-radius:10px;
margin-top:10px;
display:flex;
gap:20px;
flex-wrap:wrap;
">
<div><b>Total Records:</b> <span id="totalRec">0</span></div>
<div><b>Total Net:</b> ₱ <span id="totalNet">0</span></div>
<div><b>Employees:</b> <span id="totalEmp">0</span></div>
</div>

<!-- 🔍 SEARCH -->
<input onkeyup="searchHistory(this.value)" placeholder="Search name..." style="padding:8px; margin-top:10px; width:200px;">

<!-- 📅 DATE FILTER -->
<br><br>
<input type="date" onchange="filterDate(this.value)">
<button onclick="resetFilter()">Reset</button>

<br>

<button class="back" onclick="window.location.href='payroll.html'">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>

<tbody id="table"></tbody>
</table>

<div id="details" class="details"></div>

<script>

let history = JSON.parse(localStorage.getItem("history")) || [];

// LOAD TABLE
function load(){
  table.innerHTML = "";

  if(history.length === 0){
    table.innerHTML = "<tr><td colspan='4'>No records found</td></tr>";
    updateDashboard([]);
    return;
  }

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr id="row${i}">
      <td onclick="view(${i})" style="cursor:pointer; color:blue;">${e.name}</td>
      <td onclick="view(${i})">${e.net}</td>
      <td onclick="view(${i})">${e.date}</td>
      <td><button class="delete" onclick="del(${i})">Delete</button></td>
    </tr>
    `;
  });

  // 🔥 ADD ONLY (dashboard update)
  updateDashboard(history);
}

// VIEW
function view(i){

  document.querySelectorAll("#table tr").forEach(r=>{
    r.style.background="";
  });

  let row = document.getElementById("row"+i);
  if(row) row.style.background="#d1ffd1";

  let e = history[i];

  document.getElementById("details").innerHTML = `
  <table style="min-width:900px; border-collapse:collapse; border:2px solid green;">

    <tr style="background:green; color:white;">
      <th>Name</th>
      <th>Gross</th>
      <th>OT</th>
      <th>Holiday</th>
      <th>Vacation</th>
      <th>Sick</th>
      <th>Birthday</th>
      <th>SSS</th>
      <th>PhilHealth</th>
      <th>Pag-IBIG</th>
      <th>Net</th>
    </tr>

    <tr>
      <td>${e.name}</td>
      <td>${e.gross}</td>
      <td>${e.ot}</td>
      <td>${e.holiday}</td>
      <td>${e.vac}</td>
      <td>${e.sick}</td>
      <td>${e.bday}</td>
      <td>${e.sss}</td>
      <td>${e.philhealth}</td>
      <td>${e.pagibig}</td>
      <td><b style="color:green;">${e.net}</b></td>
    </tr>

  </table>

  <br>

  <button onclick="printRecord()">🖨️ Print</button>
  <button onclick="exportRecord()">📊 Export</button>
  `;
}

// DELETE
function del(i){
  if(confirm("Delete this record?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    details.innerHTML = "";
  }
}

// PRINT
function printRecord(){
  let content = document.getElementById("details").innerHTML;
  let w = window.open("");
  w.document.write(content);
  w.print();
}

// EXPORT
function exportRecord(){
  let content = document.getElementById("details").innerHTML;

  let blob = new Blob([content], {type:"application/vnd.ms-excel"});
  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "payroll_record.xls";
  a.click();
}

// SEARCH
function searchHistory(value){
  let rows = document.querySelectorAll("#table tr");

  rows.forEach(r=>{
    let cell = r.children[0];
    if(!cell) return;

    let text = cell.innerText.toLowerCase();
    r.style.display = text.includes(value.toLowerCase()) ? "" : "none";
  });
}

// 🔥 DASHBOARD FUNCTION (ADD ONLY)
function updateDashboard(data){

  document.getElementById("totalRec").innerText = data.length;

  let total = 0;
  let empSet = new Set();

  data.forEach(e=>{
    total += Number(e.net);
    empSet.add(e.name);
  });

  document.getElementById("totalNet").innerText = total.toFixed(2);
  document.getElementById("totalEmp").innerText = empSet.size;
}

// DATE FILTER
function filterDate(date){

  let rows = document.querySelectorAll("#table tr");

  rows.forEach((r,i)=>{
    let e = history[i];
    if(!e) return;

    r.style.display = e.date.includes(date) ? "" : "none";
  });

  let filtered = history.filter(e=>e.date.includes(date));
  updateDashboard(filtered);
}

// RESET
function resetFilter(){
  load();
}

// INIT
load();
if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}
</script>

</body>
</html>
