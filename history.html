<!DOCTYPE html>
<html>
<head>
  <title>Payroll History</title>
  <style>
    body {
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
    }

    h2 {
      border-bottom:3px solid blue;
    }

    button {
      padding:8px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .back {background:#444; margin-bottom:10px;}
    .delete {background:red;}

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      background:white;
      border:2px solid blue;
    }

    th, td {
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    th {
      background:blue;
      color:white;
    }

    tr:hover {
      background:#f1f1f1;
    }

    .details {
      margin-top:20px;
      padding:20px;
      border:2px solid blue;
      border-radius:10px;
      background:white;
      max-width:500px;
    }

    .line {
      display:flex;
      justify-content:space-between;
      padding:5px 0;
      border-bottom:1px dashed #ccc;
    }

    .net {
      font-weight:bold;
      color:green;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>
<body>

<h2>📊 Payroll History</h2>

<button class="back" onclick="back()">⬅ Back</button>

<table>
<tr>
<th>Name</th>
<th>Net</th>
<th>Date</th>
<th>Action</th>
</tr>
<tbody id="table"></tbody>
</table>

<div id="details"></div>

<script>
let history = JSON.parse(localStorage.getItem("history")) || [];

// LOAD TABLE
function load(){
  table.innerHTML = "";

  history.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td onclick="view(${i})">${e.name}</td>
      <td onclick="view(${i})">${e.net}</td>
      <td onclick="view(${i})">${e.date}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

// VIEW DETAILS
function view(i){
  let e = history[i];

  details.innerHTML = `
  <div class="details">
    <h3>${e.name}</h3>

    <table style="width:100%; border-collapse:collapse;">
      <tr>
        <th style="text-align:left;">Type</th>
        <th style="text-align:right;">Amount</th>
      </tr>

      <tr><td>Gross</td><td style="text-align:right;">${e.gross}</td></tr>
      <tr><td>OT</td><td style="text-align:right;">${e.ot}</td></tr>
      <tr><td>Holiday</td><td style="text-align:right;">${e.holiday}</td></tr>
      <tr><td>Leave</td><td style="text-align:right;">${e.leave}</td></tr>

      <tr><td colspan="2"><hr></td></tr>

      <tr><td>SSS</td><td style="text-align:right;">${e.sss}</td></tr>
      <tr><td>PhilHealth</td><td style="text-align:right;">${e.philhealth}</td></tr>
      <tr><td>Pag-IBIG</td><td style="text-align:right;">${e.pagibig}</td></tr>

      <tr><td colspan="2"><hr></td></tr>

      <tr>
        <td><b>Net</b></td>
        <td style="text-align:right; color:green;"><b>${e.net}</b></td>
      </tr>
    </table>
  </div>
  `;
}

// DELETE
function del(i){
  if(confirm("Delete this record?")){
    history.splice(i,1);
    localStorage.setItem("history", JSON.stringify(history));
    load();
    details.innerHTML = "";
  }
}

// BACK
function back(){
  window.location.href = "payroll.html";
}

// INIT
load();
</script>

</body>
</html>
