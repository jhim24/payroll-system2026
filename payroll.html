<!DOCTYPE html>
<html>
<head>
  <title>Payroll</title>
  <style>
    body {font-family:Arial; padding:20px; background:#fff7f0;}
    h2 {border-bottom:3px solid green;}

    button {
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .back {background:#444;}
    .compute {background:green;}

    select,input {
      padding:8px;
      margin:5px;
      width:180px;
    }

    table {
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      border:2px solid green;
    }

    th,td {
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    th {background:green; color:white;}
  </style>
</head>
<body>

<h2>💰 Payroll System (Auto Deduction)</h2>

<button class="back" onclick="back()">⬅ Back</button>

<br><br>

<select id="emp"></select>
<input id="rate" placeholder="Daily Rate">
<input id="days" placeholder="Days Worked">

<button class="compute" onclick="compute()">Compute Salary</button>

<table>
<tr>
<th>Name</th>
<th>Gross</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Total Deduction</th>
<th>Net Pay</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>
let data = JSON.parse(localStorage.getItem("employees")) || [];

function back(){
  window.location.href="index.html";
}

function load(){
  emp.innerHTML="<option>Select Employee</option>";
  data.forEach((e,i)=>{
    emp.innerHTML += `<option value="${i}">
      ${e.fname} ${e.lname}
    </option>`;
  });
}

// 💰 AUTO DEDUCTIONS (sample logic)
function compute(){
  let i = emp.value;
  let e = data[i];

  if(!e){
    alert("Select employee");
    return;
  }

  let rate = +rate.value || 0;
  let days = +days.value || 0;

  let gross = rate * days;

  // 🔥 SAMPLE COMPUTATION (pwede pa natin i-adjust)
  let sss = gross * 0.045;        // 4.5%
  let philhealth = gross * 0.03;  // 3%
  let pagibig = 100;              // fixed

  let totalDed = sss + philhealth + pagibig;
  let net = gross - totalDed;

  table.innerHTML += `
  <tr>
    <td>${e.fname} ${e.lname}</td>
    <td>${gross.toFixed(2)}</td>
    <td>${sss.toFixed(2)}</td>
    <td>${philhealth.toFixed(2)}</td>
    <td>${pagibig.toFixed(2)}</td>
    <td>${totalDed.toFixed(2)}</td>
    <td>${net.toFixed(2)}</td>
  </tr>`;
}

load();
</script>

</body>
</html>
