<!DOCTYPE html>
<html>
<head>
  <title>Payroll Test</title>
</head>
<body>

<h2>💰 Payroll Test (Working)</h2>

<select id="emp"></select><br><br>

<input id="rate" type="number" placeholder="Rate"><br>
<input id="days" type="number" placeholder="Days"><br>

<button onclick="compute()">Compute</button>

<h3 id="result"></h3>

<script>
let data = JSON.parse(localStorage.getItem("employees")) || [];

// LOAD EMPLOYEE
let select = document.getElementById("emp");
select.innerHTML = "<option value=''>Select</option>";

data.forEach((e,i)=>{
  select.innerHTML += `<option value="${i}">
    ${e.fname} ${e.lname}
  </option>`;
});

// COMPUTE (SIMPLE VERSION)
function compute(){
  let index = document.getElementById("emp").value;
  let rate = document.getElementById("rate").value;
  let days = document.getElementById("days").value;

  if(index === ""){
    alert("Select employee");
    return;
  }

  let gross = rate * days;

  document.getElementById("result").innerHTML =
    "Gross Pay: " + gross;
}
</script>

</body>
</html>
