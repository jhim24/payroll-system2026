<!DOCTYPE html>
<html>
<head>
<title>Payroll System</title>

<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid green;}

.box {
  border:2px solid green;
  padding:15px;
  border-radius:10px;
  background:white;
}

input, select {
  padding:8px;
  margin:5px;
  width:160px;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.compute {background:green;}
.back {background:#444;}
.history {background:blue;}
.auto {background:purple;}

table {
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #999 !important;
  padding:6px !important;
  text-align:center;
  font-size:12px;
}

th {
  background:linear-gradient(to right, #2e7d32, #1b5e20);
  color:white;
  position:sticky;
  top:0;
}

tbody tr:nth-child(even){
  background:#f4f9f4;
}

tbody tr:hover{
  background:#c8e6c9;
}

tr.selected{
  background:#a5d6a7 !important;
}

.table-container{
  max-height:400px;
  overflow:auto;
  border:2px solid green;
}
</style>
</head>

<body>

<h2>💰 Payroll System</h2>

<button class="back" onclick="window.location.href='index.html'">⬅ Back</button>
<button class="history" onclick="window.location.href='history.html'">History</button>

<div class="box">

<select id="emp"></select><br>

<input id="rate" placeholder="Daily Rate">
<input id="days" placeholder="Days Worked"><br>

<input id="ot" placeholder="OT Hours">
<input id="holiday" placeholder="Holiday"><br>

<input id="vac" placeholder="Vacation">
<input id="sick" placeholder="Sick">
<input id="bday" placeholder="Birthday"><br>

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG"><br>

<button class="compute" onclick="compute()">Compute Salary</button>
<button onclick="openPayslip()">Payslip 🧾</button>
<button class="auto" onclick="autoAttendance()">Auto from Attendance ⚡</button>

</div>

<div class="table-container">
<table>
<tr>
<th>Name</th>
<th>Gross</th>
<th>OT</th>
<th>Holiday</th>
<th>Vacation</th>
<th>Sick</th>
<th>Birthday</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Net</th>
</tr>
<tbody id="table"></tbody>
</table>
</div>

<script>

// 🔥 LOAD EMPLOYEES (FIXED + AUTO UPDATE)
let data = JSON.parse(localStorage.getItem("employees")) || [];
let lastPayslip = null;

let emp = document.getElementById("emp");

// 🔥 DEBUG (optional pwede mo alisin)
console.log("EMP DATA:", data);

// RESET DROPDOWN
function loadEmployees(){

  emp.innerHTML = "<option value=''>Select Employee</option>";

  let data = JSON.parse(localStorage.getItem("employees")) || [];

  if(data.length === 0){
    emp.innerHTML += "<option>No employees found</option>";
    return;
  }

  data.forEach((e,i)=>{

    let fullName = "";

    if(e.fname || e.lname){
      fullName = (e.fname || "") + " " + (e.lname || "");
    } else if(e.name){
      fullName = e.name;
    } else {
      fullName = "Employee " + (i+1);
    }

    emp.innerHTML += `<option value="${i}">${fullName.toUpperCase()}</option>`;
  });

}

// 🔥 INITIAL LOAD
loadEmployees();


// COMPUTE
function compute(){

  let data = JSON.parse(localStorage.getItem("employees")) || [];

  let i = emp.value;

  if(i===""){
    alert("Select employee");
    return;
  }

  let e = data[i];

  let name = "";
  if(e.fname || e.lname){
    name = (e.fname || "") + " " + (e.lname || "");
  } else if(e.name){
    name = e.name;
  } else {
    name = "Employee";
  }

  let rateVal = Number(document.getElementById("rate").value) || 0;
  let daysVal = Number(document.getElementById("days").value) || 0;

  if(rateVal===0 || daysVal===0){
    alert("Enter rate & days");
    return;
  }

  let otVal = Number(document.getElementById("ot").value) || 0;
  let holidayVal = Number(document.getElementById("holiday").value) || 0;

  let vacVal = Number(document.getElementById("vac").value) || 0;
  let sickVal = Number(document.getElementById("sick").value) || 0;
  let bdayVal = Number(document.getElementById("bday").value) || 0;

  let sssVal = Number(document.getElementById("sss").value) || 0;
  let philVal = Number(document.getElementById("philhealth").value) || 0;
  let pagVal = Number(document.getElementById("pagibig").value) || 0;

  let gross = rateVal * daysVal;
  let otPay = (rateVal / 8) * otVal * 1.25;
  let holidayPay = holidayVal * rateVal * 2;

  let vacPay = vacVal * rateVal;
  let sickPay = sickVal * rateVal;
  let bdayPay = bdayVal * rateVal;

  let totalIncome = gross + otPay + holidayPay + vacPay + sickPay + bdayPay;
  let totalDed = sssVal + philVal + pagVal;

  let net = totalIncome - totalDed;

  lastPayslip = {name, gross, otPay, holidayPay, vacPay, sickPay, bdayPay, sss:sssVal, philhealth:philVal, pagibig:pagVal, net};

  let history = JSON.parse(localStorage.getItem("history")) || [];

  history.push({
    name,
    gross: gross.toFixed(2),
    ot: otPay.toFixed(2),
    holiday: holidayPay.toFixed(2),
    vac: vacPay.toFixed(2),
    sick: sickPay.toFixed(2),
    bday: bdayPay.toFixed(2),
    sss: sssVal.toFixed(2),
    philhealth: philVal.toFixed(2),
    pagibig: pagVal.toFixed(2),
    net: net.toFixed(2),
    date: new Date().toLocaleString()
  });

  localStorage.setItem("history", JSON.stringify(history));

  let table = document.getElementById("table");

  table.innerHTML += `
  <tr>
    <td>${name}</td>
    <td>${gross.toFixed(2)}</td>
    <td>${otPay.toFixed(2)}</td>
    <td>${holidayPay.toFixed(2)}</td>
    <td>${vacPay.toFixed(2)}</td>
    <td>${sickPay.toFixed(2)}</td>
    <td>${bdayPay.toFixed(2)}</td>
    <td>${sssVal.toFixed(2)}</td>
    <td>${philVal.toFixed(2)}</td>
    <td>${pagVal.toFixed(2)}</td>
    <td><b>${net.toFixed(2)}</b></td>
  </tr>
  `;

  alert("✅ Salary Computed!");
}


// AUTO ATTENDANCE
function autoAttendance(){

  let data = JSON.parse(localStorage.getItem("employees")) || [];

  let i = emp.value;

  if(i===""){
    alert("Select employee");
    return;
  }

  let e = data[i];

  let name = e.fname ? e.fname + " " + e.lname : (e.name || "");

  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

  let totalHours = 0;

  attendance.forEach(a=>{
    if(a.name === name){
      totalHours += Number(a.hours || 0);
    }
  });

  if(totalHours === 0){
    alert("No attendance found");
    return;
  }

  let days = totalHours / 8;

  document.getElementById("days").value = days.toFixed(2);

  alert("✅ Auto-filled!");
}


// AUTO REFRESH EMPLOYEES (REALTIME STYLE)
window.addEventListener("focus", loadEmployees);


// ROW SELECT
document.addEventListener("click", function(e){
  let row = e.target.closest("tr");
  if(!row || !row.parentElement) return;

  document.querySelectorAll("tbody tr").forEach(r=>{
    r.classList.remove("selected");
  });

  row.classList.add("selected");
});


// PAYSLIP
function openPayslip(){
  if(!lastPayslip){
    alert("Compute salary first!");
    return;
  }

  let p = lastPayslip;

  let win = window.open("", "", "width=800,height=600");

  win.document.write(`
  <h2>Payslip</h2>
  <p>${p.name}</p>
  <p>Net: ${p.net}</p>
  <button onclick="window.print()">Print</button>
  `);
}


// LOGIN CHECK
if(localStorage.getItem("login") !== "true"){
  window.location.href = "login.html";
}

</script>
</body>
</html>
