<script>

document.addEventListener("DOMContentLoaded", function(){

// 🔥 AUTO RESTORE
let backup = localStorage.getItem("employees_backup");

if(!localStorage.getItem("employees") && backup){
  localStorage.setItem("employees", backup);
}

// LOAD DATA
let data = JSON.parse(localStorage.getItem("employees")) || [];
let lastPayslip = null;

// LOAD EMPLOYEES
let select = document.getElementById("emp");

if(!select){
  alert("EMP SELECT NOT FOUND!");
  return;
}

select.innerHTML = "<option value=''>Select Employee</option>";

data.forEach((e,i)=>{
  select.innerHTML += `<option value="${i}">
    ${e.fname} ${e.lname}
  </option>`;
});

// BACK
window.back = function(){
  window.location.href = "index.html";
}

// HISTORY
window.goHistory = function(){
  window.location.href = "history.html";
}

// COMPUTE
window.compute = function(){

  let index = document.getElementById("emp").value;

  if(index === ""){
    alert("Select employee");
    return;
  }

  let e = data[index];

  let rate = Number(document.getElementById("rate").value) || 0;
  let days = Number(document.getElementById("days").value) || 0;

  if(rate === 0 || days === 0){
    alert("Enter rate and days");
    return;
  }

  let ot = Number(document.getElementById("ot").value) || 0;
  let holiday = Number(document.getElementById("holiday").value) || 0;

  let vac = Number(document.getElementById("vac").value) || 0;
  let sick = Number(document.getElementById("sick").value) || 0;
  let bday = Number(document.getElementById("bday").value) || 0;

  let sss = Number(document.getElementById("sss").value) || 0;
  let philhealth = Number(document.getElementById("philhealth").value) || 0;
  let pagibig = Number(document.getElementById("pagibig").value) || 0;

  let gross = rate * days;
  let otPay = (rate / 8) * ot * 1.25;
  let holidayPay = holiday * rate * 2;

  let vacPay = vac * rate;
  let sickPay = sick * rate;
  let bdayPay = bday * rate;

  let totalIncome = gross + otPay + holidayPay + vacPay + sickPay + bdayPay;
  let totalDed = sss + philhealth + pagibig;

  let net = totalIncome - totalDed;

  lastPayslip = {
    name: e.fname + " " + e.lname,
    gross, otPay, holidayPay,
    vacPay, sickPay, bdayPay,
    sss, philhealth, pagibig,
    net
  };

  let table = document.getElementById("table");

  table.innerHTML += `
    <tr>
      <td>${e.fname} ${e.lname}</td>
      <td>${gross.toFixed(2)}</td>
      <td>${otPay.toFixed(2)}</td>
      <td>${holidayPay.toFixed(2)}</td>
      <td>${vacPay.toFixed(2)}</td>
      <td>${sickPay.toFixed(2)}</td>
      <td>${bdayPay.toFixed(2)}</td>
      <td>${sss.toFixed(2)}</td>
      <td>${philhealth.toFixed(2)}</td>
      <td>${pagibig.toFixed(2)}</td>
      <td><b>${net.toFixed(2)}</b></td>
    </tr>
  `;

  alert("Salary Computed!");
}

// PAYSLIP
window.openPayslip = function(){

  if(!lastPayslip){
    alert("Compute salary first!");
    return;
  }

  let p = lastPayslip;

  let win = window.open("", "", "width=800,height=600");

  win.document.write(`
    <h2>PAYSLIP</h2>
    <p>${p.name}</p>
    <p>Net: ${p.net}</p>
    <button onclick="window.print()">Print</button>
  `);
}

});
</script>
