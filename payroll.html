<!DOCTYPE html>
<html>
<head>
  <title>Payroll</title>
  <style>
    body {font-family:Arial; padding:20px; background:#fff7f0;}
    h2 {border-bottom:3px solid green;}

    button {
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .back {background:#444;}
    .compute {background:green;}

    select,input {
      padding:8px;
      margin:5px;
      width:180px;
    }

    table {
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      border:2px solid green;
    }

    th,td {
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    th {background:green; color:white;}
  </style>
</head>
<body>

<h2>💰 Payroll System (Auto Deduction)</h2>

<button class="back" onclick="back()">⬅ Back</button>

<br><br>

<select id="emp"></select><br>

<input id="rate" type="number" placeholder="Daily Rate">
<input id="days" type="number" placeholder="Days Worked"><br>

<button class="compute" onclick="compute()">Compute Salary</button>

<table>
<tr>
<th>Name</th>
<th>Gross</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Total Deduction</th>
<th>Net Pay</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>
let data = JSON.parse(localStorage.getItem("employees")) || [];

// BACK BUTTON
function back(){
  window.location.href = "index.html";
}

// LOAD EMPLOYEES
function load(){
  let select = document.getElementById("emp");
  select.innerHTML = "<option value=''>Select Employee</option>";

  data.forEach((e,i)=>{
    select.innerHTML += `<option value="${i}">
      ${e.fname} ${e.lname}
    </option>`;
  });
}

// COMPUTE FUNCTION (FIXED)
function compute(){
  let index = document.getElementById("emp").value;

  if(index === ""){
    alert("Please select employee");
    return;
  }

  let emp = data[index];

  let rate = parseFloat(document.getElementById("rate").value) || 0;
  let days = parseFloat(document.getElementById("days").value) || 0;

  if(rate === 0 || days === 0){
    alert("Enter rate and days");
    return;
  }

  let gross = rate * days;

  // AUTO DEDUCTIONS
  let sss = gross * 0.045;
  let philhealth = gross * 0.03;
  let pagibig = 100;

  let total = sss + philhealth + pagibig;
  let net = gross - total;

  let table = document.getElementById("table");

  table.innerHTML += `
    <tr>
      <td>${emp.fname} ${emp.lname}</td>
      <td>${gross.toFixed(2)}</td>
      <td>${sss.toFixed(2)}</td>
      <td>${philhealth.toFixed(2)}</td>
      <td>${pagibig.toFixed(2)}</td>
      <td>${total.toFixed(2)}</td>
      <td>${net.toFixed(2)}</td>
    </tr>
  `;
}

// INIT
load();
</script>

</body>
</html>
