<!DOCTYPE html>
<html>
<head>
<title>Payroll System</title>

<style>
body {font-family:Arial; padding:20px; background:#eef3ff;}
h2 {border-bottom:3px solid green;}

.box {
  border:2px solid green;
  padding:15px;
  border-radius:10px;
  background:white;
}

input, select {
  padding:8px;
  margin:5px;
  width:160px;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.compute {background:green;}
.back {background:#444;}
.history {background:blue;}
.auto {background:purple;}

table {
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #999 !important;
  padding:6px !important;
  text-align:center;
  font-size:12px;
}

th {
  background:linear-gradient(to right, #2e7d32, #1b5e20);
  color:white;
  position:sticky;
  top:0;
}

tbody tr:nth-child(even){
  background:#f4f9f4;
}

tbody tr:hover{
  background:#c8e6c9;
}

tr.selected{
  background:#a5d6a7 !important;
}

.table-container{
  max-height:400px;
  overflow:auto;
  border:2px solid green;
}
</style>
</head>

<body>

<h2>💰 Payroll System</h2>

<button class="back" onclick="window.location.href='index.html'">⬅ Back</button>
<button class="history" onclick="window.location.href='history.html'">History</button>

<div class="box">

<select id="emp"></select><br>

<input id="rate" type="number" placeholder="Daily Rate">
<input id="days" type="number" placeholder="Days Worked"><br>

<input id="ot" type="number" placeholder="OT Hours">
<input id="holiday" type="number" placeholder="Holiday"><br>

<input id="vac" type="number" placeholder="Vacation">
<input id="sick" type="number" placeholder="Sick">
<input id="bday" type="number" placeholder="Birthday"><br>

<input id="sss" type="number" placeholder="SSS">
<input id="philhealth" type="number" placeholder="PhilHealth">
<input id="pagibig" type="number" placeholder="Pag-IBIG"><br>

<!-- NEW DEDUCTIONS -->
<input id="otherDed" type="number" placeholder="Other Deduction">
<input id="otherReason" placeholder="Reason"><br>

<input id="healthCard" type="number" placeholder="Health Card">
<input id="cardNumber" placeholder="Card Number"><br>

<button class="compute" onclick="compute()">Compute Salary</button>
<button onclick="openPayslip()">Payslip 🧾</button>
<button class="auto" onclick="autoAttendance()">Auto from Attendance ⚡</button>
<button style="background:orange;" onclick="updateRow()">Update ✏️</button>
</div>

<div class="table-container">
<table>
<tr>
<th>Name</th>
<th>Gross</th>
<th>OT</th>
<th>Holiday</th>
<th>Vacation</th>
<th>Sick</th>
<th>Birthday</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Other</th>
<th>Reason</th>
<th>Health Card</th>
<th>Card #</th>
<th>Net</th>
</tr>
<tbody id="table"></tbody>
</table>
</div>

<script>

let lastPayslip = null;
let emp = document.getElementById("emp");

// LOAD EMPLOYEES
function loadEmployees(){
  emp.innerHTML = "<option value=''>Select Employee</option>";
  let data = JSON.parse(localStorage.getItem("employees")) || [];

  if(data.length === 0){
    emp.innerHTML += "<option>No employees found</option>";
    return;
  }

  data.forEach((e,i)=>{
    let name = (e.fname || "") + " " + (e.lname || "") || e.name || "Employee";
    emp.innerHTML += `<option value="${i}">${name.toUpperCase()}</option>`;
  });
}

loadEmployees();

function compute(){

  let data = JSON.parse(localStorage.getItem("employees")) || [];
  let i = emp.value;

  if(i===""){ 
    alert("Select employee"); 
    return; 
  }

  let e = data[i];

  let name = "";
  if(e.fname || e.lname){
    name = (e.fname || "") + " " + (e.lname || "");
  } else if(e.name){
    name = e.name;
  } else {
    name = "Employee";
  }

  let rate = Number(document.getElementById("rate").value) || 0;
  let days = Number(document.getElementById("days").value) || 0;

  if(rate===0 || days===0){
    alert("Enter rate & days");
    return;
  }

  let ot = Number(document.getElementById("ot").value) || 0;
  let holiday = Number(document.getElementById("holiday").value) || 0;

  let vac = Number(document.getElementById("vac").value) || 0;
  let sick = Number(document.getElementById("sick").value) || 0;
  let bday = Number(document.getElementById("bday").value) || 0;

  let sss = Number(document.getElementById("sss").value) || 0;
  let phil = Number(document.getElementById("philhealth").value) || 0;
  let pag = Number(document.getElementById("pagibig").value) || 0;

  let other = Number(document.getElementById("otherDed").value) || 0;
  let reason = document.getElementById("otherReason").value || "-";

  let health = Number(document.getElementById("healthCard").value) || 0;
  let card = document.getElementById("cardNumber").value || "-";

  let gross = rate * days;
  let otPay = (rate/8) * ot * 1.25;
  let holidayPay = holiday * rate * 2;

  let vacPay = vac * rate;
  let sickPay = sick * rate;
  let bdayPay = bday * rate;

  let totalIncome = gross + otPay + holidayPay + vacPay + sickPay + bdayPay;
  let totalDed = sss + phil + pag + other + health;

  let net = totalIncome - totalDed;

  lastPayslip = {name, net};

  let table = document.getElementById("table");

  table.innerHTML += `
  <tr>
    <td>${name}</td>
    <td>${gross.toFixed(2)}</td>
    <td>${otPay.toFixed(2)}</td>
    <td>${holidayPay.toFixed(2)}</td>
    <td>${vacPay.toFixed(2)}</td>
    <td>${sickPay.toFixed(2)}</td>
    <td>${bdayPay.toFixed(2)}</td>
    <td>${sss.toFixed(2)}</td>
    <td>${phil.toFixed(2)}</td>
    <td>${pag.toFixed(2)}</td>
    <td>${other.toFixed(2)}</td>
    <td>${reason}</td>
    <td>${health.toFixed(2)}</td>
    <td>${card}</td>
    <td><b>${net.toFixed(2)}</b></td>
  </tr>
  `;

  alert("✅ Salary Computed!");
}

// AUTO ATTENDANCE
function autoAttendance(){
  let data = JSON.parse(localStorage.getItem("employees")) || [];
  let i = emp.value;

  if(i===""){ alert("Select employee"); return; }

  let e = data[i];
  let name = (e.fname || "") + " " + (e.lname || "") || e.name;

  let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

  let totalHours = 0;

  attendance.forEach(a=>{
    if((a.name || "").toLowerCase() === name.toLowerCase()){
      totalHours += Number(a.hours || 0);
    }
  });

  if(totalHours === 0){
    alert("No attendance found");
    return;
  }

  let days = totalHours / 8;
  document.getElementById("days").value = days.toFixed(2);

  alert("✅ Auto-filled!");
}


// PAYSLIP
function openPayslip(){
  if(!lastPayslip){
    alert("Compute salary first!");
    return;
  }

  let win = window.open("", "", "width=800,height=600");
  win.document.write(`
  <h2>Payslip</h2>
  <p>${lastPayslip.name}</p>
  <p>Net: ${lastPayslip.net}</p>
  <button onclick="window.print()">Print</button>
  `);
}


// AUTO REFRESH
window.addEventListener("focus", loadEmployees);
document.addEventListener("click", function(e){
  let row = e.target.closest("tr");
  if(!row || !row.parentElement || row.parentElement.id !== "table") return;

  let rows = document.querySelectorAll("#table tr");

  rows.forEach((r,i)=>{
    r.classList.remove("selected");
    if(r === row){
      r.classList.add("selected");
      selectedRowIndex = i;

      let cells = r.children;

      // LOAD SA INPUTS
      document.getElementById("rate").value = cells[1].innerText;
      document.getElementById("days").value = cells[1].innerText / cells[1].innerText; // basic fallback

      document.getElementById("ot").value = cells[2].innerText;
      document.getElementById("holiday").value = cells[3].innerText;

      document.getElementById("vac").value = cells[4].innerText;
      document.getElementById("sick").value = cells[5].innerText;
      document.getElementById("bday").value = cells[6].innerText;

      document.getElementById("sss").value = cells[7].innerText;
      document.getElementById("philhealth").value = cells[8].innerText;
      document.getElementById("pagibig").value = cells[9].innerText;

      document.getElementById("otherDed").value = cells[10].innerText;
      document.getElementById("otherReason").value = cells[11].innerText;

      document.getElementById("healthCard").value = cells[12].innerText;
      document.getElementById("cardNumber").value = cells[13].innerText;
    }
  });
 });
// LOGIN CHECK (optional)
if(localStorage.getItem("login") !== "true"){
  console.log("Login disabled for testing");
}
let selectedRowIndex = null;
  function updateRow(){

  if(selectedRowIndex === null){
    alert("Select row to update");
    return;
  }

  let rows = document.querySelectorAll("#table tr");
  let row = rows[selectedRowIndex];

  let name = emp.options[emp.selectedIndex].text;

  let rate = Number(document.getElementById("rate").value) || 0;
  let days = Number(document.getElementById("days").value) || 0;

  let ot = Number(document.getElementById("ot").value) || 0;
  let holiday = Number(document.getElementById("holiday").value) || 0;

  let vac = Number(document.getElementById("vac").value) || 0;
  let sick = Number(document.getElementById("sick").value) || 0;
  let bday = Number(document.getElementById("bday").value) || 0;

  let sss = Number(document.getElementById("sss").value) || 0;
  let phil = Number(document.getElementById("philhealth").value) || 0;
  let pag = Number(document.getElementById("pagibig").value) || 0;

  let other = Number(document.getElementById("otherDed").value) || 0;
  let reason = document.getElementById("otherReason").value || "-";

  let health = Number(document.getElementById("healthCard").value) || 0;
  let card = document.getElementById("cardNumber").value || "-";

  let gross = rate * days;
  let otPay = (rate/8) * ot * 1.25;
  let holidayPay = holiday * rate * 2;

  let vacPay = vac * rate;
  let sickPay = sick * rate;
  let bdayPay = bday * rate;

  let totalIncome = gross + otPay + holidayPay + vacPay + sickPay + bdayPay;
  let totalDed = sss + phil + pag + other + health;

  let net = totalIncome - totalDed;

  row.innerHTML = `
    <td>${name}</td>
    <td>${gross.toFixed(2)}</td>
    <td>${otPay.toFixed(2)}</td>
    <td>${holidayPay.toFixed(2)}</td>
    <td>${vacPay.toFixed(2)}</td>
    <td>${sickPay.toFixed(2)}</td>
    <td>${bdayPay.toFixed(2)}</td>
    <td>${sss.toFixed(2)}</td>
    <td>${phil.toFixed(2)}</td>
    <td>${pag.toFixed(2)}</td>
    <td>${other.toFixed(2)}</td>
    <td>${reason}</td>
    <td>${health.toFixed(2)}</td>
    <td>${card}</td>
    <td><b>${net.toFixed(2)}</b></td>
  `;

  alert("✅ Updated successfully!");
}
</script>

</body>
</html>
