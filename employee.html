<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  padding:20px;
  background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
}

h2 {
  border-bottom:3px solid blue;
  color:#2c3e50;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.nav {background:green;}
.add {background:green;}
.update {background:orange;}
.delete {background:red;}
.edit {background:gray;}

.box {
  border-radius:12px;
  background:silver;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:5px;
}

input, select {
  padding:8px;
  margin:5px;
  width:180px;
  border-radius:8px;
  border:1px solid #ccc;
}

.table-container {
  width:100%;
  overflow-x:auto;
  background:light green;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:5px;
}

table {
  min-width:1400px;
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td {
  border:1px solid #ccc;
  padding:4px;
  text-align:center;
}

th {
  background:linear-gradient(to right, #4facfe, #00c6ff);
  color:white;
}
</style>
</head>

<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<button onclick="exportData()">Export Employees 💾</button>
<input type="file" onchange="importData(event)">

<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name"><br>

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly><br>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact Number"><br>

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID"><br>

<input id="passport" placeholder="Passport">

<select id="position">
<option value="">Select Position</option>
<option>GENERAL MANAGER</option>
<option>MANAGER</option>
<option>SUPERVISOR</option>
<option>ADMIN</option>
<option>WAITER</option>
<option>WAITRESS</option>
<option>CASHIER</option>
</select>

<select id="bank">
<option value="">Select Bank</option>
<option>BDO</option>
<option>BPI</option>
<option>Metrobank</option>
<option>Landbank</option>
<option>UnionBank</option>
</select>

<input id="bankAccount" placeholder="Bank Account"><br>

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG"><br>

<button class="add" onclick="add()">Add</button>
<button class="update" onclick="update()">Update</button>
<button onclick="safeReset()">Reset All</button>

</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>First Name</th>
<th>Middle Name</th>
<th>Last Name</th>
<th>Age</th>
<th>Address</th>
<th>Contact</th>
<th>Email</th>
<th>ID</th>
<th>Passport</th>
<th>Position</th>
<th>Bank</th>
<th>Account</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>
</div>

<div style="margin-top:10px;">
<input onkeyup="search(0,this.value)" placeholder="Search First">
<input onkeyup="search(2,this.value)" placeholder="Search Last">
<input onkeyup="search(6,this.value)" placeholder="Search Email">
</div>

<script>

// 🔥 FIREBASE INIT
const firebaseConfig = {
  apiKey: "AIzaSyCZG7xQaHaCtD_evrziUqdKqHJsVOQf3A8",
  authDomain: "hr-system-18fee.firebaseapp.com",
  projectId: "hr-system-18fee",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let editId = null;

// AGE AUTO
birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

// VALIDATION
function isValid(form){
  return form.fname || form.lname || form.email;
}

// DUPLICATE
function isDuplicate(form){
  return data.some(e =>
    e.fname === form.fname &&
    e.lname === form.lname &&
    e.empid === form.empid
  );
}

// GET FORM
function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    position: position.value,
    bank: bank.value,
    bankAccount: bankAccount.value,
    sss: sss.value,
    philhealth: philhealth.value,
    pagibig: pagibig.value
  };
}

// ADD / UPDATE
function add(){
  let form = getForm();

  if(!isValid(form)){
    alert("Empty not allowed");
    return;
  }

  if(editId){
    db.collection("employees").doc(editId).update(form);
    editId = null;
    alert("Updated!");
  } else {
    if(isDuplicate(form)){
      alert("Duplicate employee");
      return;
    }
    db.collection("employees").add(form);
  }

  clear();
}

// EDIT
function edit(i){
  let e = data[i];
  editId = e.id;

  for(let key in e){
    if(document.getElementById(key)){
      document.getElementById(key).value = e[key];
    }
  }
}

// DELETE
function del(i){
  if(!confirm("Delete employee?")) return;
  db.collection("employees").doc(data[i].id).delete();
}

// CLEAR
function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  bank.value="";
  position.value="";
}

// RENDER
function render(){
  table.innerHTML="";

  data.forEach((e,i)=>{
    if(!e.fname && !e.lname && !e.email) return;

    table.innerHTML += `
    <tr>
      <td>${e.fname||""}</td>
      <td>${e.mname||""}</td>
      <td>${e.lname||""}</td>
      <td>${e.age||""}</td>
      <td>${e.address||""}</td>
      <td>${e.contact||""}</td>
      <td>${e.email||""}</td>
      <td>${e.empid||""}</td>
      <td>${e.passport||""}</td>
      <td>${e.position||""}</td>
      <td>${e.bank||""}</td>
      <td>${e.bankAccount||""}</td>
      <td>${e.sss||""}</td>
      <td>${e.philhealth||""}</td>
      <td>${e.pagibig||""}</td>
      <td>
        <button class="edit" onclick="edit(${i})">Edit</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });
}

// FIREBASE LIVE
db.collection("employees").onSnapshot(snapshot=>{
  data=[];
  snapshot.forEach(doc=>{
    let d=doc.data();
    if(!d.fname && !d.lname && !d.email) return;
    d.id=doc.id;
    data.push(d);
  });
  render();
});

// SEARCH
function search(col,val){
  let rows=document.querySelectorAll("#table tr");
  rows.forEach(r=>{
    let text=r.children[col].innerText.toLowerCase();
    r.style.display=text.includes(val.toLowerCase())?"":"none";
  });
}

// EXPORT
function exportData(){
  let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="employees.json";
  a.click();
}

// IMPORT
function importData(e){
  let file=e.target.files[0];
  let reader=new FileReader();
  reader.onload=function(){
    let d=JSON.parse(reader.result);

    JSON.parse(d.employees || "[]").forEach(emp=>{
      db.collection("employees").add(emp);
    });

    alert("Imported!");
  };
  reader.readAsText(file);
}

// RESET
function safeReset(){
  if(!confirm("Delete ALL employees?")) return;
  db.collection("employees").get().then(snap=>{
    snap.forEach(doc=>{
      db.collection("employees").doc(doc.id).delete();
    });
  });
}

// NAV
function goPayroll(){
  window.location.href="payroll.html";
}

// LOGIN
if(localStorage.getItem("login")!=="true"){
  window.location.href="login.html";
}

</script>

</body>
</html>
