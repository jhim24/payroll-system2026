<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  padding:10px;
  background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
}

h2 {
  border-bottom:3px solid blue;
  color:#2c3e50;
}

button {
  padding:8px;
  margin:4px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
  font-size:12px;
}

.nav {background:green;}
.add {background:blue;}
.update {background:orange;}
.delete {background:red;}
.edit {background:green;}

.box {
  border-radius:12px;
  background:green;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:10px;
}

/* GRID */
.form-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap:6px;
}

/* INPUT SIZE */
.form-grid input,
.form-grid select{
  width:100%;
  height:32px;
  font-size:12px;
}

/* BUTTON AREA */
.form-actions{
  margin-top:8px;
  text-align:center;
}

input, select {
  border-radius:5px;
  border:1px solid #ccc;
}

/* TABLE */
.table-container {
  width:100%;
  overflow-x:auto;
  background:lightgreen;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:5px;
}

table {
  min-width:1400px;
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

/* 🔥 COMPACT ROW FIX */
th, td {
  border:1px solid #ccc;

  padding:2px 4px;      /* 🔥 maliit */
  font-size:11px;

  white-space:normal;
  word-break:break-word;

  line-height:1.1;      /* 🔥 auto height */
  vertical-align:top;
}

/* 🔥 LIMIT WIDTH */
td {
  max-width:120px;
}

th {
  background:linear-gradient(to right, #4facfe, #00c6ff);
  color:white;
}

/* 🔥 HOVER */
tbody tr:hover{
  background:#e3f2fd;
}
</style>
</head>

<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<button onclick="exportData()">Export 💾</button>
<input type="file" onchange="importData(event)">

<div class="form-grid">

<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name">

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact">

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID">

<input id="passport" placeholder="Passport">

<select id="govType">
<option value="">Gov ID</option>
<option>UMID</option>
<option>PHILHEALTH</option>
<option>LICENSE</option>
<option>PASSPORT</option>
<option>NATIONAL ID</option>
<option>POSTAL ID</option>
</select>

<input id="govID" placeholder="ID Number">

<select id="position">
<option value="">Position</option>
<option>MANAGER</option>
<option>SUPERVISOR</option>
<option>ADMIN</option>
</select>

<select id="bank">
<option value="">Bank</option>
<option>BDO</option>
<option>BPI</option>
<option>Metrobank</option>
</select>

<input id="bankAccount" placeholder="Account">

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG">

</div>

<div class="form-actions">
<button class="add" onclick="add()">Add</button>
<button class="update" onclick="add()">Update</button>
<button onclick="safeReset()">Reset</button>
</div>

</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>First</th>
<th>Middle</th>
<th>Last</th>
<th>Age</th>
<th>Address</th>
<th>Contact</th>
<th>Email</th>
<th>ID</th>
<th>Passport</th>
<th>Gov</th>
<th>Gov ID</th>
<th>Position</th>
<th>Bank</th>
<th>Account</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>

// AUTO PLACEHOLDER
govType.onchange = function(){
  govID.placeholder = "Enter " + this.value;
};

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "hr-system-18fee.firebaseapp.com",
  projectId: "hr-system-18fee",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let editId = null;

// AGE AUTO
birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

// FORM
function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    govType: govType.value,
    govID: govID.value
  };
}

// ADD
function add(){
  let form = getForm();

  if(editId){
    db.collection("employees").doc(editId).update(form);
    editId = null;
  } else {
    db.collection("employees").add(form);
  }

  clear();
}

// DELETE
function del(i){
  db.collection("employees").doc(data[i].id).delete();
}

// CLEAR
function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
}

// RENDER
function render(){
  table.innerHTML="";
  data.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td>${e.fname||""}</td>
      <td>${e.mname||""}</td>
      <td>${e.lname||""}</td>
      <td>${e.age||""}</td>
      <td>${e.address||""}</td>
      <td>${e.contact||""}</td>
      <td>${e.email||""}</td>
      <td>${e.empid||""}</td>
      <td>${e.passport||""}</td>
      <td>${e.govType||""}</td>
      <td>${e.govID||""}</td>
      <td>${e.position||""}</td>
      <td>${e.bank||""}</td>
      <td>${e.bankAccount||""}</td>
      <td>${e.sss||""}</td>
      <td>${e.philhealth||""}</td>
      <td>${e.pagibig||""}</td>
      <td>
        <button onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

// LIVE
db.collection("employees").onSnapshot(snapshot=>{
  data=[];
  snapshot.forEach(doc=>{
    let d=doc.data();
    d.id=doc.id;
    data.push(d);
  });
  render();
});

function goPayroll(){
  window.location.href="payroll.html";
}

</script>

</body>
</html>
