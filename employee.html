<!DOCTYPE html>
  
<html>
  
<head>
  
  <title>HR System</title>
  

  
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  

  
<style>
  
body {
  
  font-family: Arial;
  
  padding:10px;
  
  background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
  
}
  

  
h2 {
  
  border-bottom:2px solid #007bff;
  
  color:#2c3e50;
  
}
  

  
button {
  
  padding:8px;
  
  margin:4px;
  
  border:none;
  
  color:white;
  
  border-radius:5px;
  
  cursor:pointer;
  
  font-size:12px;
  
}
  

  
.nav {background:#28a745;}
  
.add {background:#007bff;}
  
.update {background:#ffc107;}
  
.delete {background:#dc3545;}
  
.edit {background:#17a2b8;}
  
.cancel {background:#6c757d;}
  

  
.box {
  
  background:Aquamarine;
  
  border-radius:12px;
  
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  
  padding:10px;
  
  margin-bottom:10px;
  
}
  

  
.form-grid{
  
  display:grid;
  
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  
  gap:6px;
  
}
  

  
.form-grid input,
  
.form-grid select{
  
  width:100%;
  
  height:30px;
  
  font-size:12px;
  
  border-radius:6px;
  
  border:1px solid #ccc;
  
  padding:4px;
  
}
  

  
.form-actions{
  
  text-align:center;
  
  margin-top:10px;
  
}
  

  
.table-container {
  
  width:100%;
  
  overflow-x:auto;
  
  background:LightGray;
  
  border-radius:12px;
  
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  
  padding:10px;
  
}
  

  
table {
  
  min-width:1400px;
  
  width:100%;
  
  border-collapse:collapse;
  
  font-size:11px;
  
}
  

  
th, td {
  
  border:1px solid #ddd;
  
  padding:3px 5px;
  
  font-size:11px;
  
  white-space:normal;
  
  word-break:break-word;
  
  line-height:1.2;
  
  vertical-align:top;
  
}
  

  
td{
  
  max-width:120px;
  
}
  

  
th {
  
  background:linear-gradient(to right, #4facfe, #00c6ff);
  
  color:white;
  
}
  

  
tbody tr:hover{
  
  background:#f1f7ff;
  
}
  

  
tr.selected{
  
  background:#fff3cd !important;
  
}
  

  
#editMode{
  
  display:none;
  
  background:#fff3cd;
  
  border:1px solid #ffeeba;
  
  padding:5px;
  
  border-radius:5px;
  
  margin-bottom:5px;
  
  font-size:12px;
  
}
  
</style>
  
</head>
  

  
<body>
  

  
<h2>👥 Employee Master List</h2>
  

  
<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>
  

  
<div class="box">
  

  
<div id="editMode">✏️ Editing employee...</div>
  

  
<div class="form-grid">
  

  
<input id="fname" placeholder="First Name">
  
<input id="mname" placeholder="Middle Name">
  
<input id="lname" placeholder="Last Name">
  

  
<input type="date" id="birthday">
  
<input id="age" placeholder="Age" readonly>
  

  
<input id="address" placeholder="Address">
  
<input id="contact" placeholder="Contact">
  

  
<input id="email" placeholder="Email">
  
<input id="empid" placeholder="Employee ID">
  

  
<input id="passport" placeholder="Passport">
  

  
<select id="govType">
  
<option value="">Gov ID</option>
  
<option>UMID</option>
  
<option>PHILHEALTH</option>
  
<option>LICENSE</option>
  
<option>PASSPORT</option>
  
<option>NATIONAL ID</option>
  
<option>POSTAL ID</option>
  
</select>
  

  
<input id="govID" placeholder="ID Number">
  

  
<select id="position">
  
<option value="">Position</option>
  
<option>MANAGER</option>
  
<option>SUPERVISOR</option>
  
<option>ADMIN</option>
  
</select>
  

  
<select id="bank">
  
<option value="">Bank</option>
  
<option>BDO</option>
  
<option>BPI</option>
  
<option>Metrobank</option>
  
</select>
  

  
<input id="bankAccount" placeholder="Account">
  

  
<input id="sss" placeholder="SSS">
  
<input id="philhealth" placeholder="PhilHealth">
  
<input id="pagibig" placeholder="Pag-IBIG">
  

  
</div>
  

  
<div class="form-actions">
  
<button class="add" onclick="add()">Save</button>
  
<button class="cancel" onclick="cancelEdit()">Cancel</button>
  
<button class="delete" onclick="safeReset()">Reset</button>
  
</div>
  

  
</div>
  

  
<div class="table-container">
  
<table>
  
<thead>
  
<tr>
  
<th>First</th>
  
<th>Middle</th>
  
<th>Last</th>
  
<th>Age</th>
  
<th>Address</th>
  
<th>Contact</th>
  
<th>Email</th>
  
<th>ID</th>
  
<th>Passport</th>
  
<th>Gov</th>
  
<th>Gov ID</th>
  
<th>Position</th>
  
<th>Bank</th>
  
<th>Account</th>
  
<th>SSS</th>
  
<th>PhilHealth</th>
  
<th>Pag-IBIG</th>
  
<th>Action</th>
  
</tr>
  
</thead>
  
<tbody id="table"></tbody>
  
</table>
  
</div>
  

  
<script>
  

  
// FIREBASE
  
const firebaseConfig = {
  
  apiKey: "AIzaSyCZG7xQaHaCtD_evrziUqdKqHJsVOQf3A8",
  
  authDomain: "hr-system-18fee.firebaseapp.com",
  
  projectId: "hr-system-18fee",
  
};
  

  
firebase.initializeApp(firebaseConfig);
  
const db = firebase.firestore();
  

  
let data = [];
  
let editId = null;
  
let selectedRow = null;
  

  
// AGE AUTO
  
birthday.onchange = function(){
  
  let b = new Date(this.value);
  
  let t = new Date();
  
  age.value = t.getFullYear() - b.getFullYear();
  
};
  

  
// GET FORM
  
function getForm(){
  
  return {
  
    fname: fname.value,
  
    mname: mname.value,
  
    lname: lname.value,
  
    age: age.value,
  
    address: address.value,
  
    contact: contact.value,
  
    email: email.value,
  
    empid: empid.value,
  
    passport: passport.value,
  
    govType: govType.value,
  
    govID: govID.value,
  
    position: position.value,
  
    bank: bank.value,
  
    bankAccount: bankAccount.value,
  
    sss: sss.value,
  
    philhealth: philhealth.value,
  
    pagibig: pagibig.value
  
  };
  
}
  

  
// 🔥 ADD / UPDATE (FIXED WITH LOCAL STORAGE)
  
function add(){
  
  let form = getForm();
  

  
  if(editId){
  
    db.collection("employees").doc(editId).update(form);
  
    cancelEdit();
  
    alert("Updated!");
  
  } else {
  
    db.collection("employees").add(form);
  
  }
  

  
  // ✅ LOCAL STORAGE SYNC
  
  let local = JSON.parse(localStorage.getItem("employees")) || [];
  

  
  local.push({
  
    fname: form.fname,
  
    lname: form.lname
  
  });
  

  
  localStorage.setItem("employees", JSON.stringify(local));
  

  
  clear();
  
}
  

  
// RENDER + 🔥 AUTO SYNC TO LOCAL
  
function render(){
  
  table.innerHTML="";
  

  
  let local = [];
  

  
  data.forEach((e,i)=>{
  

  
    if(!e.fname && !e.lname && !e.email) return;
  

  
    // 🔥 collect for payroll
  
    local.push({
  
      fname: e.fname || "",
  
      lname: e.lname || ""
  
    });
  

  
    table.innerHTML += `
  
    <tr>
  
      <td>${e.fname||""}</td>
  
      <td>${e.mname||""}</td>
  
      <td>${e.lname||""}</td>
  
      <td>${e.age||""}</td>
  
      <td>${e.address||""}</td>
  
      <td>${e.contact||""}</td>
  
      <td>${e.email||""}</td>
  
      <td>${e.empid||""}</td>
  
      <td>${e.passport||""}</td>
  
      <td>${e.govType||""}</td>
  
      <td>${e.govID||""}</td>
  
      <td>${e.position||""}</td>
  
      <td>${e.bank||""}</td>
  
      <td>${e.bankAccount||""}</td>
  
      <td>${e.sss||""}</td>
  
      <td>${e.philhealth||""}</td>
  
      <td>${e.pagibig||""}</td>
  
      <td>
  
        <button class="edit" onclick="edit(${i})">Edit</button>
  
        <button class="delete" onclick="del(${i})">Delete</button>
  
      </td>
  
    </tr>`;
  
  });
  

  
  // 🔥 IMPORTANT: sync ALL employees to localStorage
  
  localStorage.setItem("employees", JSON.stringify(local));
  
}
  

  
// FIREBASE LIVE
  
db.collection("employees").onSnapshot(snapshot=>{
  
  data=[];
  
  snapshot.forEach(doc=>{
  
    let d=doc.data();
  
    d.id=doc.id;
  
    data.push(d);
  
  });
  
  render();
  
});
  

  
// OTHER FUNCTIONS (UNCHANGED)
  
function edit(i){
  
  let e = data[i];
  
  editId = e.id;
  
  for(let key in e){
  
    if(document.getElementById(key)){
  
      document.getElementById(key).value = e[key];
  
    }
  
  }
  
  document.getElementById("editMode").style.display = "block";
  
  window.scrollTo({top:0, behavior:"smooth"});
  
}
  

  
function cancelEdit(){
  
  editId = null;
  
  clear();
  
  document.getElementById("editMode").style.display = "none";
  
}
  

  
function del(i){
  
  if(!confirm("Delete employee?")) return;
  
  db.collection("employees").doc(data[i].id).delete();
  
}
  

  
function clear(){
  
  document.querySelectorAll("input").forEach(i=>i.value="");
  
  bank.value="";
  
  position.value="";
  
  govType.value="";
  
}
  

  
function safeReset(){
  
  if(!confirm("Delete ALL employees?")) return;
  
  db.collection("employees").get().then(snap=>{
  
    snap.forEach(doc=>{
  
      db.collection("employees").doc(doc.id).delete();
  
    });
  
  });
  
}
  

  
function goPayroll(){
  
  window.location.href="payroll.html";
  
}
  

  
if(localStorage.getItem("login")!=="true"){
  
  window.location.href="login.html";
  
}
  

  
</script>
  

  
</body>
  
</html>
