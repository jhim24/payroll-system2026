<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  padding:10px;
  background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
}

h2 {
  border-bottom:3px solid blue;
  color:#2c3e50;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.nav {background:green;}
.add {background:blue;}
.update {background:orange;}
.delete {background:red;}
.edit {background:green;}

.box {
  border-radius:12px;
  background:green;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:5px;
}

input, select {
  padding:5px;
  margin:5px;
  width:180px;
  border-radius:5px;
  border:1px solid #ccc;
}

.table-container {
  width:100%;
  overflow-x:auto;
  background:lightgreen;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  padding:5px;
}

table {
  min-width:1400px;
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td {
  border:1px solid #ccc;
  padding:4px 4px;
  text-align:center;
  white-space:normal;
  word-break:break-word;
  line-height:1.1;
  font-size:12px;
  vertical-align:top;
}

th {
  background:linear-gradient(to right, #4facfe, #00c6ff);
  color:white;
}
</style>
</head>

<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<button onclick="exportData()">Export Employees 💾</button>
<input type="file" onchange="importData(event)">

<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name"><br>

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly><br>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact Number"><br>

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID"><br>

<input id="passport" placeholder="Passport">

<!-- 🔥 ADD GOVERNMENT ID -->
<select id="govType">
  <option value="">Select Government ID</option>
  <option>UMID</option>
  <option>PHILHEALTH</option>
  <option>LICENSE</option>
  <option>PASSPORT</option>
  <option>NATIONAL ID</option>
  <option>POSTAL ID</option>
</select>

<input id="govID" placeholder="Enter ID Number">

<select id="position">
<option value="">Select Position</option>
<option>GENERAL MANAGER</option>
<option>MANAGER</option>
<option>SUPERVISOR</option>
<option>ADMIN</option>
<option>WAITER</option>
<option>WAITRESS</option>
<option>CASHIER</option>
</select>

<select id="bank">
<option value="">Select Bank</option>
<option>BDO</option>
<option>BPI</option>
<option>Metrobank</option>
<option>Landbank</option>
<option>UnionBank</option>
</select>

<input id="bankAccount" placeholder="Bank Account"><br>

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG"><br>

<button class="add" onclick="add()">Add</button>
<button class="update" onclick="update()">Update</button>
<button onclick="safeReset()">Reset All</button>

</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>First Name</th>
<th>Middle Name</th>
<th>Last Name</th>
<th>Age</th>
<th>Address</th>
<th>Contact</th>
<th>Email</th>
<th>ID</th>
<th>Passport</th>
<th>Gov Type</th>
<th>Gov ID</th>
<th>Position</th>
<th>Bank</th>
<th>Account</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>
</div>

<div style="margin-top:10px;">
<input onkeyup="search(0,this.value)" placeholder="Search First">
<input onkeyup="search(2,this.value)" placeholder="Search Last">
<input onkeyup="search(6,this.value)" placeholder="Search Email">
</div>

<script>

// 🔥 AUTO PLACEHOLDER
govType.onchange = function(){
  govID.placeholder = "Enter " + this.value + " Number";
};

// FIREBASE INIT
const firebaseConfig = {
  apiKey: "AIzaSyCZG7xQaHaCtD_evrziUqdKqHJsVOQf3A8",
  authDomain: "hr-system-18fee.firebaseapp.com",
  projectId: "hr-system-18fee",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let editId = null;

birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    govType: govType.value,
    govID: govID.value,
    position: position.value,
    bank: bank.value,
    bankAccount: bankAccount.value,
    sss: sss.value,
    philhealth: philhealth.value,
    pagibig: pagibig.value
  };
}

function add(){
  let form = getForm();
  db.collection("employees").add(form);
  clear();
}

function edit(i){
  let e = data[i];
  editId = e.id;
  for(let key in e){
    if(document.getElementById(key)){
      document.getElementById(key).value = e[key];
    }
  }
}

function del(i){
  db.collection("employees").doc(data[i].id).delete();
}

function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  bank.value="";
  position.value="";
  govType.value="";
}

function render(){
  table.innerHTML="";
  data.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td>${e.fname||""}</td>
      <td>${e.mname||""}</td>
      <td>${e.lname||""}</td>
      <td>${e.age||""}</td>
      <td>${e.address||""}</td>
      <td>${e.contact||""}</td>
      <td>${e.email||""}</td>
      <td>${e.empid||""}</td>
      <td>${e.passport||""}</td>
      <td>${e.govType||""}</td>
      <td>${e.govID||""}</td>
      <td>${e.position||""}</td>
      <td>${e.bank||""}</td>
      <td>${e.bankAccount||""}</td>
      <td>${e.sss||""}</td>
      <td>${e.philhealth||""}</td>
      <td>${e.pagibig||""}</td>
      <td>
        <button onclick="edit(${i})">Edit</button>
        <button onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

db.collection("employees").onSnapshot(snapshot=>{
  data=[];
  snapshot.forEach(doc=>{
    let d=doc.data();
    d.id=doc.id;
    data.push(d);
  });
  render();
});

function goPayroll(){
  window.location.href="payroll.html";
}

</script>

</body>
</html>
