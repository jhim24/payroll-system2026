<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  background: PaleTurquoise;
  margin: 0;
  padding: 20px;
}

/* HEADER */
h2 {
  color:#2c3e50;
  margin-bottom:15px;
}

/* BUTTONS */
button {
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: bold;
  transition: 0.3s;
  border:none;
  cursor:pointer;
}
button:hover {
  transform: scale(1.05);
  opacity: 0.9;
}

.nav {background:#28a745; color:white;}
.add {background:#007bff; color:white;}
.delete {background:#dc3545; color:white;}
.edit {background:#17a2b8; color:white;}
.cancel {background:#6c757d; color:white;}

/* CARD */
.box {
  background: Cornsilk;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}

/* FORM GRID */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
}

.form-grid input,
.form-grid select {
  width: 100%;
  height: 40px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  box-sizing: border-box;
}

/* ACTIONS */
.form-actions {
  text-align:center;
  margin-top:20px;
}

.form-actions button {
  margin:5px;
}

/* TABLE */
.table-container {
  background: silver;
  border-radius: 12px;
  padding: 10px;
  overflow-x: auto;
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  text-align:center;
  border:1px solid #999;
  white-space:nowrap;
}

th {
  background:#007bff;
  color:white;
}
</style>
</head>

<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<div id="editMode" style="display:none;color:red;">Editing...</div>

<div class="form-grid">
<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name">

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact">

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID">

<input id="passport" placeholder="Passport">

<select id="govType">
<option value="">Gov ID</option>
<option>UMID</option>
<option>PHILHEALTH</option>
<option>LICENSE</option>
<option>PASSPORT</option>
</select>

<input id="govID" placeholder="ID Number">

<select id="position">
<option value="">Position</option>
<option>MANAGER</option>
<option>SUPERVISOR</option>
<option>ADMIN</option>
</select>

<select id="bank">
<option value="">Bank</option>
<option>BDO</option>
<option>BPI</option>
</select>

<input id="bankAccount" placeholder="Account">

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG">
</div>

<div class="form-actions">
<button class="add" onclick="add()">Save</button>
<button class="cancel" onclick="cancelEdit()">Cancel</button>
<button class="delete" onclick="safeReset()">Reset</button>
</div>

</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>First</th>
<th>Middle</th>
<th>Last</th>
<th>Age</th>
<th>Address</th>
<th>Contact</th>
<th>Email</th>
<th>ID</th>
<th>Passport</th>
<th>Gov</th>
<th>Gov ID</th>
<th>Position</th>
<th>Bank</th>
<th>Account</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZG7xQaHaCtD_evrziUqdKqHJsVOQf3A8",
  authDomain: "hr-system-18fee.firebaseapp.com",
  projectId: "hr-system-18fee",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let editId = null;

birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    govType: govType.value,
    govID: govID.value,
    position: position.value,
    bank: bank.value,
    bankAccount: bankAccount.value,
    sss: sss.value,
    philhealth: philhealth.value,
    pagibig: pagibig.value
  };
}

function add(){
  let form = getForm();
  if(editId){
    db.collection("employees").doc(editId).update(form);
    cancelEdit();
  } else {
    db.collection("employees").add(form);
  }
  clear();
}

function render(){
  table.innerHTML="";
  data.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td>${e.fname||"-"}</td>
      <td>${e.mname||"-"}</td>
      <td>${e.lname||"-"}</td>
      <td>${e.age||"-"}</td>
      <td>${e.address||"-"}</td>
      <td>${e.contact||"-"}</td>
      <td>${e.email||"-"}</td>
      <td>${e.empid||"-"}</td>
      <td>${e.passport||"-"}</td>
      <td>${e.govType||"-"}</td>
      <td>${e.govID||"-"}</td>
      <td>${e.position||"-"}</td>
      <td>${e.bank||"-"}</td>
      <td>${e.bankAccount||"-"}</td>
      <td>${e.sss||"-"}</td>
      <td>${e.philhealth||"-"}</td>
      <td>${e.pagibig||"-"}</td>
      <td>
        <button class="edit" onclick="edit(${i})">Edit</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

db.collection("employees").onSnapshot(snapshot=>{
  data=[];
  snapshot.forEach(doc=>{
    let d=doc.data();
    d.id=doc.id;
    data.push(d);
  });
  render();
});

function edit(i){
  let e = data[i];
  editId = e.id;
  for(let key in e){
    if(document.getElementById(key)){
      document.getElementById(key).value = e[key];
    }
  }
  document.getElementById("editMode").style.display = "block";
}

function cancelEdit(){
  editId = null;
  clear();
  document.getElementById("editMode").style.display = "none";
}

function del(i){
  if(!confirm("Delete?")) return;
  db.collection("employees").doc(data[i].id).delete();
}

function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
}

function safeReset(){
  if(!confirm("Delete ALL?")) return;
  db.collection("employees").get().then(snap=>{
    snap.forEach(doc=>{
      db.collection("employees").doc(doc.id).delete();
    });
  });
}

function goPayroll(){
  window.location.href="payroll.html";
}
</script>

</body>
</html>
