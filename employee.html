<!DOCTYPE html>
<html>
<head>
  <title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#eef3ff;
}

h2 {
  border-bottom:3px solid blue;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.nav {background:green;}
.add {background:green;}
.update {background:orange;}
.delete {background:red;}
.edit {background:gray;}

.box {
  border:2px solid blue;
  padding:5px;
  border-radius:10px;
  background:white;
}

input, select {
  padding:8px;
  margin:5px;
  width:180px;
}

/* TABLE */
.table-container {
  width:100%;
  overflow-x:auto;
}

table {
  min-width:1400px;
  width:100%;
  margin-top:5px;
  border-collapse:collapse;
  background:white;
  border:2px solid blue;
  font-size:12px;
}

th, td {
  border:1px solid #ccc;
  padding:5px;
  text-align:center;
  white-space:nowrap;
}

th {
  background:blue;
  color:white;
}
</style>
</head>

<body>

<h2>👥 Employee Master List</h2>

<button class="nav" onclick="goPayroll()">Go to Payroll 💰</button>

<div class="box">

<input id="fname" placeholder="First Name">
<input id="mname" placeholder="Middle Name">
<input id="lname" placeholder="Last Name"><br>

<input type="date" id="birthday">
<input id="age" placeholder="Age" readonly><br>

<input id="address" placeholder="Address">
<input id="contact" placeholder="Contact"><br>

<input id="email" placeholder="Email">
<input id="empid" placeholder="Employee ID"><br>

<input id="passport" placeholder="Passport">

<select id="position">
<option value="">Select Position</option>
<option>MANAGER</option>
<option>SUPERVISOR</option>
<option>ADMIN</option>
</select>

<select id="bank">
<option value="">Select Bank</option>
<option>BDO</option>
<option>BPI</option>
<option>Metrobank</option>
</select>

<input id="bankAccount" placeholder="Bank Account"><br>

<input id="sss" placeholder="SSS">
<input id="philhealth" placeholder="PhilHealth">
<input id="pagibig" placeholder="Pag-IBIG"><br>

<button class="add" onclick="add()">Add</button>
<button class="update" onclick="update()">Update</button>

</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>First Name</th>
<th>Middle Name</th>
<th>Last Name</th>
<th>Age</th>
<th>Address</th>
<th>Contact</th>
<th>Email</th>
<th>ID</th>
<th>Passport</th>
<th>Position</th>
<th>Bank</th>
<th>Account</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>
</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCZG7xQaHaCtD_evrziUqdKqHJsVOQf3A8",
  authDomain: "hr-system-18fee.firebaseapp.com",
  projectId: "hr-system-18fee",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let editId = null;

// AGE AUTO
birthday.onchange = function(){
  let b = new Date(this.value);
  let t = new Date();
  age.value = t.getFullYear() - b.getFullYear();
};

// GET FORM
function getForm(){
  return {
    fname: fname.value,
    mname: mname.value,
    lname: lname.value,
    age: age.value,
    address: address.value,
    contact: contact.value,
    email: email.value,
    empid: empid.value,
    passport: passport.value,
    position: position.value,
    bank: bank.value,
    bankAccount: bankAccount.value,
    sss: sss.value,
    philhealth: philhealth.value,
    pagibig: pagibig.value
  };
}

// ADD
function add(){
  let form = getForm();
  db.collection("employees").add(form);
  clear();
}

// EDIT
function edit(i){
  let e = data[i];
  editId = e.id;

  for(let key in e){
    if(document.getElementById(key)){
      document.getElementById(key).value = e[key];
    }
  }
}

// UPDATE
function update(){
  if(!editId) return;

  let form = getForm();
  db.collection("employees").doc(editId).update(form);
  editId = null;
  clear();
}

// DELETE
function del(i){
  db.collection("employees").doc(data[i].id).delete();
}

// CLEAR
function clear(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  bank.value="";
  position.value="";
}

// RENDER
function render(){
  table.innerHTML="";
  data.forEach((e,i)=>{
    table.innerHTML += `
    <tr>
      <td>${e.fname||""}</td>
      <td>${e.mname||""}</td>
      <td>${e.lname||""}</td>
      <td>${e.age||""}</td>
      <td>${e.address||""}</td>
      <td>${e.contact||""}</td>
      <td>${e.email||""}</td>
      <td>${e.empid||""}</td>
      <td>${e.passport||""}</td>
      <td>${e.position||""}</td>
      <td>${e.bank||""}</td>
      <td>${e.bankAccount||""}</td>
      <td>${e.sss||""}</td>
      <td>${e.philhealth||""}</td>
      <td>${e.pagibig||""}</td>
      <td>
        <button class="edit" onclick="edit(${i})">Edit</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

// LIVE
db.collection("employees").onSnapshot(snapshot=>{
  data=[];
  snapshot.forEach(doc=>{
    let d=doc.data();
    d.id=doc.id;
    data.push(d);
  });
  render();
});

// NAV
function goPayroll(){
  window.location.href="payroll.html";
}

</script>

</body>
</html>
