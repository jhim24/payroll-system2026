<!DOCTYPE html>
<html>
<head>
  <title>Auto Attendance System</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
      text-align:center;
    }

    h2{
      border-bottom:3px solid blue;
    }

    input, select{
      padding:8px;
      margin:5px;
      width:180px;
    }

    button{
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .add{background:green;}
    .delete{background:red;}
    .nav{background:blue;}

    table{
      width:100%;
      margin-top:5px;
      border-collapse:collapse;
      background:white;
      font-size:12px;
    }

    th, td{
      border:1px solid #ccc;
      padding:4px;
    }

    th{
      background:blue;
      color:white;
    }
  </style>
</head>

<body>

<h2>🕒 AUTO ATTENDANCE</h2>

<button class="nav" onclick="back()">⬅ Back to Dashboard</button>

<br><br>

<select id="emp"></select>
<input type="date" id="date">
<input type="time" id="timeIn">
<input type="time" id="timeOut">

<br>

<button class="add" onclick="add()">Add Attendance</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Time In</th>
      <th>Time Out</th>
      <th>Hours</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="table"></tbody>
</table>

<script>

// LOAD DATA
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

// LOAD EMPLOYEES
emp.innerHTML = "<option value=''>Select Employee</option>";
employees.forEach((e,i)=>{
  emp.innerHTML += `<option value="${i}">${e.fname} ${e.lname}</option>`;
});

// SAVE
function save(){
  localStorage.setItem("attendance", JSON.stringify(attendance));
}

// COMPUTE HOURS
function computeHours(inTime, outTime){
  if(!inTime || !outTime) return 0;

  let start = new Date("2020-01-01 " + inTime);
  let end = new Date("2020-01-01 " + outTime);

  let diff = (end - start) / (1000 * 60 * 60);
  return diff > 0 ? diff.toFixed(2) : 0;
}

// AUTO STATUS
function getStatus(timeIn){
  if(!timeIn) return "Absent";

  let lateTime = new Date("2020-01-01 09:15"); // late after 9:15
  let actual = new Date("2020-01-01 " + timeIn);

  if(actual > lateTime) return "Late";
  return "Present";
}

// ADD
function add(){

  let index = emp.value;

  if(index===""){
    alert("Select employee");
    return;
  }

  let e = employees[index];

  let hours = computeHours(timeIn.value, timeOut.value);
  let status = getStatus(timeIn.value);

  let record = {
    name: e.fname + " " + e.lname,
    date: date.value,
    timeIn: timeIn.value,
    timeOut: timeOut.value,
    hours: hours,
    status: status
  };

  attendance.push(record);

  save();
  render();
}

// DELETE
function del(i){
  attendance.splice(i,1);
  save();
  render();
}

// RENDER
function render(){
  table.innerHTML="";

  attendance.forEach((a,i)=>{
    table.innerHTML += `
    <tr>
      <td>${a.name}</td>
      <td>${a.date}</td>
      <td>${a.timeIn}</td>
      <td>${a.timeOut}</td>
      <td>${a.hours}</td>
      <td>${a.status}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });
}

// BACK
function back(){
  window.location.href="index.html";
}

render();

</script>

</body>
</html>
