<!DOCTYPE html>
<html>
<head>
  <title>Auto Attendance System</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial;
      padding:5px;
      background:#eef3ff;
      text-align:center;
    }

    h2{
      border-bottom:3px solid blue;
    }

    input, select{
      padding:8px;
      margin:5px;
      width:180px;
    }

    button{
      padding:5px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .add{background:green;}
    .delete{background:red;}
    .nav{background:blue;}

    table{
      width:100%;
      margin-top:5px;
      border-collapse:collapse;
      background:white;
      font-size:12px;
    }

    th, td{
      border:1px solid #ccc;
      padding:4px;
    }

    th{
      background:blue;
      color:white;
    }

    /* 🔥 TIMESHEET STYLE (ADD ONLY) */
    #timesheet{
      margin-top:10px;
      border-collapse:collapse;
      width:100%;
    }

    #timesheet th, #timesheet td{
      border:1px solid #333;
      padding:5px;
      font-size:12px;
      text-align:center;
    }

    #timesheet th{
      background:#dbe3f3;
      color:black;
    }

    /* 🔥 ADD ONLY HIGHLIGHT */
    tr.selected{
      background:#ffe082 !important;
    }

  </style>
</head>

<body>

<h2>🕒 AUTO ATTENDANCE</h2>

<button class="nav" onclick="back()">⬅ Back to Dashboard</button>

<br><br>

<select id="emp"></select>
<input type="date" id="date">
<input type="time" id="timeIn">
<input type="time" id="timeOut">

<br>

<button class="add" onclick="add()">Add Attendance</button>

<!-- 🔥 ADD ONLY -->
<button class="nav" onclick="today()">Today 📅</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Time In</th>
      <th>Time Out</th>
      <th>Hours</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="table"></tbody>
</table>

<!-- 🔥 ADDED TIMESHEET SECTION -->
<hr>

<h2>📊 TIMESHEET VIEW</h2>

<div>
  <label>Department:</label>
  <input id="dept">

  <label>Supervisor:</label>
  <input id="supervisor">

  <label>Date:</label>
  <input type="date" id="tdate">

  <label>Rate:</label>
  <input id="rate" placeholder="₱/hr">
</div>

<table id="timesheet">
  <thead>
    <tr>
      <th>Name</th>
      <th>Time In</th>
      <th>Time Out</th>
      <th>OT</th>
      <th>Total Hours</th>
      <th>Pay</th>
    </tr>
  </thead>

  <tbody id="timesheetBody"></tbody>

  <tfoot>
    <tr>
      <th colspan="4">Total Hours</th>
      <th id="totalHours"></th>
      <th></th>
    </tr>
    <tr>
      <th colspan="5">Total Pay</th>
      <th id="totalPay"></th>
    </tr>
  </tfoot>
</table>

<script>

// LOAD DATA
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

// LOAD EMPLOYEES
emp.innerHTML = "<option value=''>Select Employee</option>";
employees.forEach((e,i)=>{
  emp.innerHTML += `<option value="${i}">${e.fname} ${e.lname}</option>`;
});

// SAVE
function save(){
  localStorage.setItem("attendance", JSON.stringify(attendance));
}

// COMPUTE HOURS
function computeHours(inTime, outTime){
  if(!inTime || !outTime) return 0;

  let start = new Date("2020-01-01 " + inTime);
  let end = new Date("2020-01-01 " + outTime);

  let diff = (end - start) / (1000 * 60 * 60);
  return diff > 0 ? diff.toFixed(2) : 0;
}

// STATUS
function getStatus(timeIn){
  if(!timeIn) return "Absent";

  let lateTime = new Date("2020-01-01 09:15");
  let actual = new Date("2020-01-01 " + timeIn);

  if(actual > lateTime) return "Late";
  return "Present";
}

// ADD
function add(){

  let index = emp.value;

  if(index===""){
    alert("Select employee");
    return;
  }

  let e = employees[index];

  let hours = computeHours(timeIn.value, timeOut.value);
  let status = getStatus(timeIn.value);

  let record = {
    name: e.fname + " " + e.lname,
    date: date.value,
    timeIn: timeIn.value,
    timeOut: timeOut.value,
    hours: hours,
    status: status
  };

  attendance.push(record);

  save();
  render();
}

// DELETE
function del(i){
  attendance.splice(i,1);
  save();
  render();
}

// RENDER
function render(){
  table.innerHTML="";

  attendance.forEach((a,i)=>{
    table.innerHTML += `
    <tr>
      <td>${a.name}</td>
      <td>${a.date}</td>
      <td>${a.timeIn}</td>
      <td>${a.timeOut}</td>
      <td>${a.hours}</td>
      <td>${a.status}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });

  generateTimesheet();
}

// 🔥 TIMESHEET
function generateTimesheet(){

  let body = document.getElementById("timesheetBody");
  body.innerHTML = "";

  let totalH = 0;
  let totalP = 0;
  let rate = parseFloat(document.getElementById("rate").value) || 0;
  let filterDate = document.getElementById("tdate").value;

  attendance.forEach(a=>{

    // 🔥 FILTER BY DATE
    if(filterDate && a.date !== filterDate) return;

    let hours = parseFloat(a.hours) || 0;

    // 🔥 AUTO OT (more than 8 hrs)
    let ot = hours > 8 ? (hours - 8).toFixed(2) : 0;

    let pay = hours * rate;

    totalH += hours;
    totalP += pay;

    body.innerHTML += `
      <tr>
        <td>${a.name}</td>
        <td>${a.timeIn}</td>
        <td>${a.timeOut}</td>
        <td>${ot}</td>
        <td>${hours}</td>
        <td>${pay.toFixed(2)}</td>
      </tr>
    `;
  });

  document.getElementById("totalHours").innerText = totalH.toFixed(2);
  document.getElementById("totalPay").innerText = totalP.toFixed(2);
}

// 🔥 AUTO UPDATE
document.addEventListener("input", function(e){
  if(e.target.id === "rate" || e.target.id === "tdate"){
    generateTimesheet();
  }
});

// 🔥 TODAY BUTTON
function today(){
  let now = new Date().toISOString().slice(0,10);
  document.getElementById("date").value = now;
}

// 🔥 ROW SELECT
document.addEventListener("click", function(e){
  let row = e.target.closest("tr");
  if(!row) return;

  document.querySelectorAll("tbody tr").forEach(r=>{
    r.classList.remove("selected");
  });

  row.classList.add("selected");
});

// BACK
function back(){
  window.location.href="index.html";
}

render();

</script>

</body>
</html>
