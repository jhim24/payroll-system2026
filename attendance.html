<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial;
      padding:20px;
      background:#eef3ff;
      text-align:center;
    }

    h2{
      border-bottom:3px solid blue;
    }

    input, select{
      padding:8px;
      margin:5px;
      width:180px;
    }

    button{
      padding:10px;
      margin:5px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .add{background:green;}
    .delete{background:red;}
    .nav{background:blue;}

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background:white;
      font-size:12px;
    }

    th, td{
      border:1px solid #ccc;
      padding:8px;
    }

    th{
      background:blue;
      color:white;
    }
  </style>
</head>

<body>

<h2>🕒 Attendance Sheet</h2>

<button class="nav" onclick="back()">⬅ Back to Dashboard</button>

<br><br>

<select id="emp"></select>
<input type="date" id="date">
<input type="time" id="timeIn">
<input type="time" id="timeOut">

<select id="status">
  <option>Present</option>
  <option>Late</option>
  <option>Absent</option>
</select>

<br>

<button class="add" onclick="add()">Add Attendance</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Time In</th>
      <th>Time Out</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="table"></tbody>
</table>

<script>

// LOAD EMPLOYEES
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let attendance = JSON.parse(localStorage.getItem("attendance")) || [];

let empSelect = document.getElementById("emp");

empSelect.innerHTML = "<option value=''>Select Employee</option>";

employees.forEach((e,i)=>{
  empSelect.innerHTML += `<option value="${i}">
    ${e.fname} ${e.lname}
  </option>`;
});

// SAVE
function save(){
  localStorage.setItem("attendance", JSON.stringify(attendance));
}

// RENDER
function render(){
  table.innerHTML="";

  attendance.forEach((a,i)=>{
    table.innerHTML += `
    <tr>
      <td>${a.name}</td>
      <td>${a.date}</td>
      <td>${a.timeIn}</td>
      <td>${a.timeOut}</td>
      <td>${a.status}</td>
      <td>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>
    `;
  });
}

// ADD ATTENDANCE
function add(){

  let index = emp.value;

  if(index===""){
    alert("Select employee");
    return;
  }

  let e = employees[index];

  let record = {
    name: e.fname + " " + e.lname,
    date: date.value,
    timeIn: timeIn.value,
    timeOut: timeOut.value,
    status: status.value
  };

  attendance.push(record);

  save();
  render();
}

// DELETE
function del(i){
  attendance.splice(i,1);
  save();
  render();
}

// BACK
function back(){
  window.location.href="index.html";
}

render();

</script>

</body>
</html>
